# The DeepSeek Harness launcher's declared values.
#
# This is not a DSH configuration file: `tools/launch_dsh.py` reads it and renders a
# `--patch` overlay for the shipped web or headless profile. Keeping the values here means
# a DSH version bump or a model change is a one-line edit, not a hunt through YAML.

[harness]
# The release the generated overlay and plugin are tested against. `dsh_version` is what
# `npx` fetches when no installed `dsh` is found; `tested_node` is that release's floor.
tested_dsh = "0.2.2-rc.5"
dsh_version = "0.2.2-rc.5"
tested_node = "22.19"
max_tasks = 256

[plugin]
timeout_ms = 120000
max_output_bytes = 4194304
# Advisory in this tranche: a refused dossier still runs if its values are present,
# and the result's intake block says so. Flip to true to stop a refused target before
# the kernel; nothing else changes.
require_dossier = false

# The providers every launch mounts. The model selector chooses among them;
# `--provider` sets the session default, and `--model` overrides the id.
[providers.deepseek]
label = "DeepSeek"
route = "llm-deepseek"
provider = "deepseek-official"
api_key_env = "DEEPSEEK_API_KEY"
default_model = "deepseek-v4-flash"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]

[providers.openai]
label = "OpenAI"
route = "llm-pi-ai"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-5.5"
models = ["gpt-5.5", "gpt-5.5-pro", "gpt-5.4"]

[providers.anthropic]
label = "Anthropic"
route = "llm-pi-ai"
provider = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-5"
models = ["claude-sonnet-5", "claude-opus-5", "claude-haiku-4-5"]

[providers.kimi]
label = "Kimi (Moonshot)"
route = "llm-pi-ai"
provider = "moonshotai"
api_key_env = "MOONSHOT_API_KEY"
default_model = "kimi-k2.6"
models = ["kimi-k2.6", "kimi-k3.1-pro"]

[providers.minimax]
label = "MiniMax"
route = "llm-pi-ai"
provider = "minimax"
api_key_env = "MINIMAX_API_KEY"
default_model = "MiniMax-M2.7"
models = ["MiniMax-M2.7", "MiniMax-M3"]

[mcp]
tool_call_timeout_ms = 60000
startup_timeout_ms = 30000
close_timeout_ms = 5000

[skills]
# `--skills hazop` writes these catalog skills plus the harness-only `azoth-hazop`
# procedure. `--skills full` writes all 90 catalog skills.
hazop = [
  "azoth-run-calculation",
  "azoth-keycard",
  "azoth-units-vocabulary",
  "azoth-provenance-verification",
  "azoth-relief-load-screening",
  "azoth-depressurization-screening",
  "azoth-psv-orifice-screening",
  "azoth-separator-modelling",
  "azoth-flare-radiation-screening",
  "azoth-safety-function-coverage-screening",
  "azoth-vacuum-collapse-screening",
  "azoth-firewater-deluge-design",
  "azoth-hydrate-margin-check",
  "azoth-hydrate-screening",
  "azoth-wax-margin-check",
  "azoth-produced-water-scale-screening",
  "azoth-final-report-writing-style",
  "azoth-prose-english",
]

# The same shape as the HAZOP subset; the procedure itself is harness-only.
intake = [
  "azoth-run-calculation",
  "azoth-keycard",
  "azoth-units-vocabulary",
  "azoth-provenance-verification",
  "azoth-final-report-writing-style",
  "azoth-prose-english",
]

[studies.hazop]
root = "chair"
roles = ["chair", "process", "safety", "scribe"]
skill = "azoth-hazop"
description = "Run a HAZOP as an azoth team: nodes and guidewords, deviation, cause, consequence and safeguard, recorded on the DeepSeek Harness Team board. USE WHEN: a HAZOP, a node-and-guideword study, or a process-safety review is to be run."
requires_flowsheet = true
web_only = true

[studies.intake]
root = "intake-clerk"
roles = ["intake-clerk", "intake-reader", "intake-assessor", "intake-auditor"]
skill = "azoth-intake"
description = "Review the supplied evidence before a calculation: sources, claims, bindings, hard and soft gaps, and the data requests. USE WHEN: a prompt or document supplies inputs to an azoth calculation, or a calculation's basis must be audited."
requires_flowsheet = false
web_only = true
root_asks_user = true

[presets.engineer]
id = "azoth-engineer"
order = 5
prompt = "prompts/engineer.md"

[presets.chair]
id = "azoth-hazop-chair"
order = 10
prompt = "prompts/chair.md"

[presets.process]
