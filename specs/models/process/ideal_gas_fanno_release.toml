id = "process.ideal_gas_fanno_release"
name = "Ideal-gas Fanno pipe release"
kind = "procedure"
assumptions = [
    "**a quasi-steady adiabatic constant-area pipe** of a calorically perfect gas with a specified constant Darcy friction factor; one segment from the stagnation boundary to the release plane.",
    "**the friction length is** `f L / D`; the exit Mach is one when choked, otherwise the inlet Mach for an exit at the receiving pressure is found by a 120-iteration bisection.",
    "**the Fanno function is the class own**: `(1 - M^2)/(gamma M^2) + (gamma+1)/(2 gamma) ln((gamma+1) M^2/(2 + (gamma-1) M^2))`.",
    "**the stagnation-pressure ratio is the Fanno `(1/M) ((2 + (gamma-1) M^2)/(gamma+1))^((gamma+1)/(2(gamma-1)))`**, applied at both the inlet and the exit Mach.",
    "**the solid-risk gate is conservative**: a station whose component is at or below its triple point is refused as `invalid`, and a water-bearing hydrate-forming station likewise; the captured states are above every triple point and carry no water.",
    "**one gas phase is required**, and the ambient expansion is isentropic from the exit stagnation pressure with the upstream stagnation temperature.",
    "**the mass-flux closure is `1e-9`**: the exit flux must equal the inlet flux at the solved Mach.",
    "**no forward flow is a valid zero** with three stations; a zero or one-sided flow path is `unsupported` or a typed refusal.",
    "**the fluid is PR with the classic mixing rule**, because this library databank route resolves Peng-Robinson and no other; the class own SRK tests are captured as evidence.",
]
references = [
    "NASA NTRS 20070036728 - the GFSSP nitrogen Fanno case the class carries as an external benchmark.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/release/IdealGasFannoPipeReleaseModel.java` is the port source, through its `calculate`.",
    "`validation/neqsim/captures/process_ideal_gas_fanno_release.tsv` - the pinned nitrogen states at 50 bar, a short and a long pipe, the high-back-pressure and no-flow rows, the NASA case and the no-path refusal.",
]
[source]
standard = "NeqSim process/safety/release/IdealGasFannoPipeReleaseModel.java"
edition = "Its `calculate`: the one-gas-phase check, the Fanno function and its two bisections, the `1/M` stagnation-pressure ratio, the stations and the mass-flux closure."

[source.neqsim]
class = "IdealGasFannoPipeReleaseModel"
members = ["IdealGasFannoPipeReleaseModel.calculate"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[algorithm]
scheme = "ideal_gas_fanno_pipe"
initialisation = "stated_inlet_state"
convergence = "relative"
tolerance = 1.0e-9
max_iterations = 120
[inputs]
[inputs.components]
type = "components"
description = "the gas's substances, by name, resolved against the component databank.\n"
[inputs.upstream_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream stagnation composition, checked rather than renormalised.\n"
[inputs.upstream_t]
unit = "K"
description = "the upstream stagnation temperature.\n"
[inputs.upstream_p]
unit = "Pa"
description = "the upstream stagnation pressure, absolute.\n"
[inputs.diameter]
unit = "m"
description = "the pipe's internal diameter; the physical area is `pi d^2 / 4`.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
description = "the effective full-bore area factor in `(0, 1]`.\n"
[inputs.back_pressure]
unit = "Pa"
description = "the receiving absolute pressure. At or above `upstream_p` the model reports no forward flow.\n"
[inputs.flow_path_length]
unit = "m"
description = "the pipe length from the inventory boundary to the release plane. Zero with a zero friction factor is `unsupported`.\n"
[inputs.darcy_friction_factor]
unit = "dimensionless"
description = "the specified Darcy friction factor in `[0, 1]`; zero with a zero length is `unsupported`.\n"
[outputs]
[outputs.status]
type = "string"
description = "`valid`, `invalid` or `unsupported`.\n"
[outputs.mass_flow_rate]
unit = "kg/s"
optional = true
description = "the release rate, or absent when the result is not usable. A valid no-forward-flow result states `0.0`.\n"
[outputs.choked]
type = "boolean"
description = "whether the exit is sonic; false on failure and on no forward flow.\n"
[outputs.throat_sound_speed]
unit = "m/s"
optional = true
description = "the exit sound speed, present on every non-zero result.\n"
[outputs.component_mole_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mole fractions.\n"
[outputs.component_mass_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mass fractions.\n"
[outputs.friction_length]
unit = "dimensionless"
optional = true
description = "`f L / D`, absent on failure and on no forward flow.\n"
[outputs.inlet_mach]
unit = "dimensionless"
optional = true
description = "the pipe-inlet Mach number, absent on failure and on no forward flow.\n"
[outputs.exit_mach]
unit = "dimensionless"
optional = true
description = "the pipe-exit Mach number, absent on failure and on no forward flow.\n"
[outputs.stations]
type = "record_list"
description = "the resolved stations, upstream first. Empty on failure, and the ambient row is absent on no forward flow.\n"
[outputs.stations.fields.station]
type = "enum"
values = ["upstream_stagnation", "throat_critical", "orifice_exit", "ambient_expanded"]
description = "which station this row is.\n"
[outputs.stations.fields.pressure]
unit = "Pa"
description = "the station's absolute pressure.\n"
[outputs.stations.fields.temperature]
unit = "K"
description = "the station's temperature.\n"
[outputs.stations.fields.density]
unit = "kg/m**3"
description = "the station's ideal-gas density.\n"
[outputs.stations.fields.molar_enthalpy]
unit = "J/mol"
description = "the station's molar enthalpy.\n"
[outputs.stations.fields.molar_entropy]
unit = "J/(mol*K)"
description = "the station's molar entropy.\n"
[outputs.stations.fields.velocity]
unit = "m/s"
description = "the station's axial velocity.\n"
[outputs.stations.fields.mass_flux]
unit = "kg/(m**2*s)"
description = "`rho times velocity`, before the discharge coefficient.\n"
[outputs.stations.fields.phase]
type = "enum"
values = ["all_vapour", "all_liquid", "two_phase"]
description = "what the feed flash found; one gas phase for this model.\n"
[outputs.stations.fields.gas_mass_fraction]
unit = "dimensionless"
description = "the gas phase's share of the mass; one for this model.\n"
[outputs.stations.fields.gas_density]
unit = "kg/m**3"
optional = true
description = "the gas phase's own density; equal to the station density here.\n"
[outputs.stations.fields.liquid_density]
unit = "kg/m**3"
optional = true
description = "the liquid phase's density; absent because this model admits one gas phase.\n"
[outputs.stations.fields.gas_velocity]
unit = "m/s"
optional = true
description = "the gas phase's velocity; absent because this model resolves no slip.\n"
[outputs.stations.fields.liquid_velocity]
unit = "m/s"
optional = true
description = "the liquid phase's velocity; absent because this model resolves no slip.\n"
[outputs.diagnostics]
type = "record_list"
description = "the model's assumption and check records, in the order it forms them.\n"
[outputs.diagnostics.fields.code]
type = "string"
description = "the stable machine code.\n"
[outputs.diagnostics.fields.message]
type = "string"
description = "the engineering detail.\n"
[outputs.diagnostic_codes]
type = "vector_string"
length = "one per diagnostic"
description = "the codes alone, so a case can hold the contract without asserting prose.\n"
[[valid_range]]
quantity = "upstream_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "upstream_p"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[[valid_range]]
quantity = "diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "an opening has a positive diameter"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "`ReleaseFlowRequest` refuses a coefficient outside `(0, 1]`"
[[valid_range]]
quantity = "back_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[[valid_range]]
quantity = "flow_path_length"
min = 0
min_inclusive = true
severity = "error"
rationale = "the request refuses a negative length"
[[valid_range]]
quantity = "darcy_friction_factor"
min = 0
min_inclusive = true
max = 1
max_inclusive = true
severity = "error"
rationale = "the request refuses a friction factor outside [0, 1]"
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[provenance.algorithm.convergence]
source = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[provenance.algorithm.initialisation]
source = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[provenance.algorithm.max_iterations]
source = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[provenance.algorithm.scheme]
source = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[provenance.algorithm.tolerance]
source = "NeqSim IdealGasFannoPipeReleaseModel.calculate"

[implementations]
python = "azoth.process.ideal_gas_fanno_release"
rust = "azoth_process::ideal_gas_fanno_release"
