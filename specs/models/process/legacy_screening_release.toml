id = "process.legacy_screening_release"
name = "Legacy orifice screening release"
kind = "procedure"
assumptions = [
    "**the historical screening equation**, not a physical release model: a choked branch from `P`, `gamma`, `T` and `MW`, and a subcritical branch from `2 rho (P - P_back)`.",
    "**the result is always `valid_with_warnings`** on a usable state, and its diagnostics say `SCREENING_ONLY`, `UNRESOLVED_STATIONS` and `LEGACY_FALLBACK_POLICY`.",
    "**the openings alias the upstream state**: the class does not solve a throat, so both the throat and the exit carry the flashed upstream pressure, temperature, density, enthalpy and entropy.",
    "**the rate's density is the ideal-gas fallback `P M/(8.314 T)`**: the class flashes a clone without initialising its properties, so its density read is NaN and the fallback supplies the value; the station keeps the EOS density.",
    "**the opening velocity is** the rate over `rho A_eff`, where `A_eff` is the discharge coefficient times the physical area; the throat and exit rows carry it.",
    "**a zero rate forces `choked` false** and adds `NO_FORWARD_FLOW_OR_SCREENING_ZERO`; a negative or non-finite rate is `invalid`.",
    "**the class's TP-flash failure fallback is unreachable here**: a failed flash is `invalid` rather than an initialized-state substitute.",
    "**the port's phase words are `all_vapour`, `all_liquid` and `two_phase`**, and its station words are snake case.",
    "**the fluid is PR with the classic mixing rule**, because this library's databank route resolves Peng-Robinson and no other; the class's own SRK tests are captured as evidence.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/release/LegacyScreeningReleaseModel.java` is the port source, through its `calculate`, and `LeakModel.calculateMassFlowRate` is the historical equation it delegates to.",
    "`validation/neqsim/captures/process_legacy_screening_release.tsv` - the pinned leak-model states re-cased on PR, the two opening sizes, the subcritical and zero-flow rows, and the SRK evidence.",
]
[source]
standard = "NeqSim process/safety/release/LegacyScreeningReleaseModel.java"
edition = "Its `calculate`: the flashed upstream aliases, the delegated historical rate, the gamma default, the opening velocity and the screening diagnostics."

[source.neqsim]
class = "LegacyScreeningReleaseModel"
members = ["LegacyScreeningReleaseModel.calculate"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[algorithm]
scheme = "legacy_orifice_screening"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.components]
type = "components"
description = "the inventory's substances, by name, resolved against the component databank.\n"
[inputs.upstream_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream composition, checked rather than renormalised.\n"
[inputs.upstream_t]
unit = "K"
description = "the upstream temperature.\n"
[inputs.upstream_p]
unit = "Pa"
description = "the upstream stagnation pressure, absolute.\n"
[inputs.diameter]
unit = "m"
description = "the circular opening's diameter; the physical area is `pi d^2 / 4`.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
description = "the effective-area factor in `(0, 1]`.\n"
[inputs.back_pressure]
unit = "Pa"
description = "the receiving absolute pressure. At or above `upstream_p` the model reports no forward flow.\n"
[outputs]
[outputs.status]
type = "string"
description = "`valid_with_warnings` on a usable state, `invalid` or `unsupported` otherwise.\n"
[outputs.mass_flow_rate]
unit = "kg/s"
optional = true
description = "the screening rate, or absent when the result is not usable. A valid no-forward-flow result states `0.0`.\n"
[outputs.choked]
type = "boolean"
description = "whether the screening equation's critical ratio admits the receiving pressure; false on zero flow and on failure.\n"
[outputs.throat_sound_speed]
unit = "m/s"
optional = true
description = "absent: the historical equation reports no sound speed.\n"
[outputs.component_mole_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mole fractions.\n"
[outputs.component_mass_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mass fractions, `z_i M_i / sum(z M)`.\n"
[outputs.stations]
type = "record_list"
description = "three stations, upstream first: the stagnation state and the throat and exit aliases. Empty on failure.\n"
[outputs.stations.fields.station]
type = "enum"
values = ["upstream_stagnation", "throat_critical", "orifice_exit", "ambient_expanded"]
description = "which station this row is; the legacy model reports no ambient station.\n"
[outputs.stations.fields.pressure]
unit = "Pa"
description = "the station's absolute pressure.\n"
[outputs.stations.fields.temperature]
unit = "K"
description = "the station's temperature.\n"
[outputs.stations.fields.density]
unit = "kg/m**3"
description = "mass over the EOS total volume.\n"
[outputs.stations.fields.molar_enthalpy]
unit = "J/mol"
description = "the station's molar enthalpy.\n"
[outputs.stations.fields.molar_entropy]
unit = "J/(mol*K)"
description = "the station's molar entropy.\n"
[outputs.stations.fields.velocity]
unit = "m/s"
description = "zero at the stagnation row; the opening velocity `mdot/(rho A_eff)` on the aliases.\n"
[outputs.stations.fields.mass_flux]
unit = "kg/(m**2*s)"
description = "`rho times velocity`, before the discharge coefficient.\n"
[outputs.stations.fields.phase]
type = "enum"
values = ["all_vapour", "all_liquid", "two_phase"]
description = "what the feed flash found.\n"
[outputs.stations.fields.gas_mass_fraction]
unit = "dimensionless"
description = "the gas phase's share of the mass. **A mass fraction, not the molar vapour fraction.**\n"
[outputs.stations.fields.gas_density]
unit = "kg/m**3"
optional = true
description = "the gas phase's own density, when the flash resolved one.\n"
[outputs.stations.fields.liquid_density]
unit = "kg/m**3"
optional = true
description = "the liquid phase's density, when the flash resolved one.\n"
[outputs.stations.fields.gas_velocity]
unit = "m/s"
optional = true
description = "the gas phase's velocity; absent, because the screening model resolves no slip.\n"
[outputs.stations.fields.liquid_velocity]
unit = "m/s"
optional = true
description = "the liquid phase's velocity; absent, because the screening model resolves no slip.\n"
[outputs.diagnostics]
type = "record_list"
description = "the model's screening and fallback records, in the order it forms them.\n"
[outputs.diagnostics.fields.code]
type = "string"
description = "the stable machine code.\n"
[outputs.diagnostics.fields.message]
type = "string"
description = "the engineering detail.\n"
[outputs.diagnostic_codes]
type = "vector_string"
length = "one per diagnostic"
description = "the codes alone, so a case can hold the contract without asserting prose.\n"
[[valid_range]]
quantity = "upstream_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "upstream_p"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[[valid_range]]
quantity = "diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "an opening has a positive diameter"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "`ReleaseFlowRequest` refuses a coefficient outside `(0, 1]`"
[[valid_range]]
quantity = "back_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim LegacyScreeningReleaseModel.calculate"

[provenance.algorithm.convergence]
source = "NeqSim LegacyScreeningReleaseModel.calculate"

[provenance.algorithm.max_iterations]
source = "NeqSim LegacyScreeningReleaseModel.calculate"

[provenance.algorithm.scheme]
source = "NeqSim LegacyScreeningReleaseModel.calculate"

[provenance.algorithm.tolerance]
source = "NeqSim LegacyScreeningReleaseModel.calculate"

[implementations]
python = "azoth.process.legacy_screening_release"
rust = "azoth_process::legacy_screening_release"
