id = "process.drift_flux_release"
name = "Vertical drift-flux orifice release"
kind = "procedure"
assumptions = [
    "**the homogeneous-equilibrium base, then the bounded vertical drift flux**: the stations are the HEM scan's, and the shared Zuber-Findlay/Harmathy closure solves the opening's slip ratio.",
    "**the opening must resolve one gas and one liquid phase** with both mass fractions above `1e-10`, and the liquid must be denser than the gas; a single-phase opening is `unsupported`.",
    "**the closure's constants are the class's**: distribution parameter `1.2`, Harmathy coefficient `1.53`, gravity `9.80665`, and 80 bisections over the slip ratio.",
    "**the bracket starts at one and doubles** to at most `128` until the drift residual changes sign; a bracket that never does is `invalid`.",
    "**the closures are the class's**: the phase area fractions sum to one within `1e-10`, the phase kinetic energy matches the homogeneous within `1e-9 max(1, KE)`, and a gas area fraction above `0.80` is `unsupported`.",
    "**the rate is the closure's mass flux** times the effective area; the ambient station is re-solved only when it keeps two phases.",
    "**the base's Mach and acoustic diagnostics are dropped** and the model reports no throat sound speed.",
    "**no forward flow passes through unchanged** with `DRIFT_FLUX_NOT_APPLIED`; a base failure carries `EQUILIBRIUM_BASE_<code>`.",
    "**the fluid is PR with the classic mixing rule**, because this library's databank route resolves Peng-Robinson and no other; the class's own SRK tests are captured as evidence.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/release/DriftFluxHomogeneousEquilibriumReleaseModel.java` is the port source, through its `calculate`; `TwoPhaseDriftFluxClosure` is the shared closure.",
    "`validation/neqsim/captures/process_drift_flux_release.tsv` - methane/n-heptane at 300 K and 30 bar across the PR two-phase window, two surface tensions, the gas-area bound and the single-gas refusal.",
]
[source]
standard = "NeqSim process/safety/release/DriftFluxHomogeneousEquilibriumReleaseModel.java"
edition = "Its `calculate`: the homogeneous base, the exactly-two-phase opening check, the Zuber-Findlay/Harmathy drift-flux solve, the phase-area and kinetic-energy closures and the closure's rate."

[source.neqsim]
class = "DriftFluxHomogeneousEquilibriumReleaseModel"
members = ["DriftFluxHomogeneousEquilibriumReleaseModel.calculate"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[algorithm]
scheme = "drift_flux_partition"
initialisation = "hem_isentropic_pressure_scan"
convergence = "absolute"
tolerance = 1.0e-10
max_iterations = 80
[inputs]
[inputs.components]
type = "components"
description = "the fluid's substances, by name, resolved against the component databank.\n"
[inputs.upstream_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream stagnation composition, checked rather than renormalised.\n"
[inputs.upstream_t]
unit = "K"
description = "the upstream stagnation temperature.\n"
[inputs.upstream_p]
unit = "Pa"
description = "the upstream stagnation pressure, absolute.\n"
[inputs.diameter]
unit = "m"
description = "the circular opening's diameter; the physical area is `pi d^2 / 4`.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
description = "the effective-area factor in `(0, 1]`.\n"
[inputs.back_pressure]
unit = "Pa"
description = "the receiving absolute pressure. At or above `upstream_p` the model reports no forward flow.\n"
[inputs.surface_tension]
unit = "N/m"
description = "the gas/liquid interfacial tension the Harmathy drift velocity reads. Must be positive.\n"
[outputs]
[outputs.status]
type = "string"
description = "`valid`, `invalid` or `unsupported`.\n"
[outputs.mass_flow_rate]
unit = "kg/s"
optional = true
description = "the closure's release rate, or absent when the result is not usable. A valid no-forward-flow result states `0.0`.\n"
[outputs.choked]
type = "boolean"
description = "the base scan's choked flag; false on failure and on no forward flow.\n"
[outputs.throat_sound_speed]
unit = "m/s"
optional = true
description = "absent: the derived model drops the base's throat sound speed.\n"
[outputs.component_mole_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mole fractions.\n"
[outputs.component_mass_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream overall mass fractions.\n"
[outputs.stations]
type = "record_list"
description = "the base stations, with the opening's phase velocities solved. Empty on failure.\n"
[outputs.stations.fields.station]
type = "enum"
values = ["upstream_stagnation", "throat_critical", "orifice_exit", "ambient_expanded"]
description = "which station this row is.\n"
[outputs.stations.fields.pressure]
unit = "Pa"
description = "the station's absolute pressure.\n"
[outputs.stations.fields.temperature]
unit = "K"
description = "the station's temperature.\n"
[outputs.stations.fields.density]
unit = "kg/m**3"
description = "mass over the EOS total volume, the base's value.\n"
[outputs.stations.fields.molar_enthalpy]
unit = "J/mol"
description = "the station's molar enthalpy.\n"
[outputs.stations.fields.molar_entropy]
unit = "J/(mol*K)"
description = "the station's molar entropy, which the expansion holds fixed.\n"
[outputs.stations.fields.velocity]
unit = "m/s"
description = "the station's bulk velocity: the base's on the stagnation row, `mass_flux/rho` at the opening.\n"
[outputs.stations.fields.mass_flux]
unit = "kg/(m**2*s)"
description = "the closure's mass flux at the opening, before the discharge coefficient.\n"
[outputs.stations.fields.phase]
type = "enum"
values = ["all_vapour", "all_liquid", "two_phase"]
description = "what the base flash found.\n"
[outputs.stations.fields.gas_mass_fraction]
unit = "dimensionless"
description = "the gas phase's share of the mass. **A mass fraction, not the molar vapour fraction.**\n"
[outputs.stations.fields.gas_density]
unit = "kg/m**3"
optional = true
description = "the gas phase's own density, when the base resolved one.\n"
[outputs.stations.fields.liquid_density]
unit = "kg/m**3"
optional = true
description = "the liquid phase's own density, when the base resolved one.\n"
[outputs.stations.fields.gas_velocity]
unit = "m/s"
optional = true
description = "the solved gas velocity at the opening and the two-phase ambient; absent elsewhere.\n"
[outputs.stations.fields.liquid_velocity]
unit = "m/s"
optional = true
description = "the solved liquid velocity at the opening and the two-phase ambient; absent elsewhere.\n"
[outputs.diagnostics]
type = "record_list"
description = "the model's assumptions and the base's retained records.\n"
[outputs.diagnostics.fields.code]
type = "string"
description = "the stable machine code.\n"
[outputs.diagnostics.fields.message]
type = "string"
description = "the engineering detail.\n"
[outputs.diagnostic_codes]
type = "vector_string"
length = "one per diagnostic"
description = "the codes alone, so a case can hold the contract without asserting prose.\n"
[[valid_range]]
quantity = "upstream_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "upstream_p"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[[valid_range]]
quantity = "diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "an opening has a positive diameter"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "`ReleaseFlowRequest` refuses a coefficient outside `(0, 1]`"
[[valid_range]]
quantity = "back_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[[valid_range]]
quantity = "surface_tension"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive surface tension"
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim DriftFluxHomogeneousEquilibriumReleaseModel.calculate"

