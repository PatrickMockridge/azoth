id = "process.overpressure_protection_study"
name = "Overpressure protection study"
kind = "procedure"
assumptions = [
    "**the governing case is the first credible scenario with the largest positive relief rate**; the comparison is strict, so a tie goes to the earlier row. A zero-rate or unfit row leaves the study unsized with the class's two messages.",
    "**the fire basis is 21% overpressure and every other cause 10%**, the class's two constants; the peak is `set_pressure + (set_pressure - atm) fraction`.",
    "**gas, liquid and two-phase sizing reuse the ported API 520 arithmetic** (`process.psv_sizing`'s area methods and orifice ladder), with `false, false` for the balanced-bellows and rupture-disk flags; the selected capacity is `rate selected_area / required_area`, not the class's capacity helper.",
    "**a liquid case with no stated density falls back to 700 kg/m3** with the class's message, and its viscosity to 5e-4; the four relief loads publish no density, so a caller composing a liquid study states one.",
    "**a two-phase case missing any omega input skips the sizing** with the class's message and still runs the accumulated-pressure acceptance.",
    "**a gas case with no molar mass leaves the study unsized** with the class's missing-basis message rather than passing a NaN into the sizing; the two-phase omega method does not read one.",
    "**the accumulated-pressure check is the ported `process.overpressure_acceptance`**, and its failure message carries the basis prose the class formats; the item name is read only by logging and sits outside this id.",
]
references = [
    "API STD 520, Part I (9th edition, 2014). Sizing, selection and installation of pressure-relieving devices.",
    "API STD 521 (7th edition, 2020). Pressure-relieving and depressurizing systems.",
    "TR3001. Overpressure protection, the governing-case selection and the accumulated-pressure limits.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/overpressure/OverpressureProtectionStudy.java` is the port source.",
    "`validation/neqsim/captures/process_overpressure_protection_study.tsv` - gas, liquid and two-phase governing cases, no credible scenario, a zero rate, a capacity shortfall, an acceptance failure, a fire case and an empty study.",
]
[source]
standard = "NeqSim process/safety/overpressure/OverpressureProtectionStudy.java"
edition = "Its `evaluate`: the governing-case selection, the three sizing branches, the selected capacity and the accumulated-pressure check."
[algorithm]
scheme = "overpressure_protection_study"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.mawp]
unit = "Pa"
description = "the protected item's maximum allowable working pressure, absolute and above zero; the acceptance basis.\n"
[inputs.scenarios]
type = "record_list"
row_type = "OverpressureScenario"
description = "the documented relief scenarios. **An empty list is a study with nothing to size**, and it answers the class's no-credible-scenario message.\n"
[inputs.scenarios.fields.name]
type = "string"
description = "the scenario's name, echoed on the governing row.\n"
[inputs.scenarios.fields.cause]
type = "enum"
values = [
    "blocked_outlet",
    "check_valve_leakage",
    "gas_blow_by",
    "liquid_blow_by",
    "volatile_liquid_ingress",
    "inadvertent_valve_opening",
    "control_valve_failure",
    "fire",
    "thermal_expansion",
    "choke_collapse",
    "tube_rupture",
    "vacuum",
    "other",
]
description = "the overpressure cause, which selects the 21% fire basis and the acceptance factor.\n"
[inputs.scenarios.fields.phase]
type = "enum"
values = ["vapour", "liquid", "two_phase"]
description = "the relieving phase, which selects the sizing branch.\n"
[inputs.scenarios.fields.relief_rate]
unit = "kg/s"
description = "the required relief rate, at least zero; a zero-rate row is not a credible positive demand.\n"
[inputs.scenarios.fields.relief_temperature]
unit = "K"
optional = true
description = "the relieving temperature, above zero; absent is the class's 288.15 K for the gas and two-phase branches.\n"
[inputs.scenarios.fields.molar_mass]
unit = "kg/mol"
optional = true
description = "the relieving fluid's molar mass, above zero. Required by the gas and two-phase branches; their absence is refused.\n"
[inputs.scenarios.fields.compressibility]
unit = "dimensionless"
optional = true
description = "the relieving fluid's `Z`; absent is the builder's 1.0.\n"
[inputs.scenarios.fields.specific_heat_ratio]
unit = "dimensionless"
optional = true
description = "the relieving fluid's isentropic exponent; absent is the builder's 1.3.\n"
[inputs.scenarios.fields.density]
unit = "kg/m**3"
optional = true
description = "the liquid's density, above zero; the liquid branch's first choice.\n"
[inputs.scenarios.fields.viscosity]
unit = "Pa*s"
optional = true
description = "the liquid's dynamic viscosity in Pa*s, above zero; absent is the class's 5e-4.\n"
[inputs.scenarios.fields.gas_mass_fraction]
unit = "dimensionless"
optional = true
description = "the two-phase inlet's gas mass fraction in `[0, 1]`.\n"
[inputs.scenarios.fields.gas_density]
unit = "kg/m**3"
optional = true
description = "the two-phase gas density, above zero.\n"
[inputs.scenarios.fields.liquid_density]
unit = "kg/m**3"
optional = true
description = "the two-phase liquid density, above zero; also the liquid branch's second choice.\n"
[inputs.scenarios.fields.latent_heat]
unit = "dimensionless"
optional = true
description = "the latent heat in J/kg, above zero; dimensionless because the vocabulary has no specific-energy unit.\n"
[inputs.scenarios.fields.liquid_heat_capacity]
unit = "dimensionless"
optional = true
description = "the liquid heat capacity in J/(kg K), above zero; dimensionless for the same reason.\n"
[inputs.scenarios.fields.credible]
type = "boolean"
optional = true
description = "whether the scenario may govern; absent is the builder's true.\n"
[inputs.relief_set_pressure]
unit = "Pa"
optional = true
description = "the relief device set pressure, absolute and above zero; absent is the MAWP.\n"
[inputs.back_pressure]
unit = "Pa"
optional = true
description = "the built-up back pressure at the device outlet, at least zero; absent is the class's 1.01325 bara.\n"
[inputs.multiple_devices]
type = "boolean"
optional = true
description = "whether more than one device protects the item; absent is false.\n"
[outputs]
[outputs.governing_name]
type = "string"
optional = true
description = "the governing scenario's name; absent when no credible scenario exists.\n"
[outputs.governing_cause]
type = "string"
optional = true
description = "the governing cause's spelling.\n"
[outputs.governing_phase]
type = "string"
optional = true
description = "the governing phase's spelling.\n"
[outputs.governing_relief_rate]
unit = "kg/s"
optional = true
description = "the governing scenario's relief rate.\n"
[outputs.required_area]
unit = "m**2"
optional = true
description = "the required orifice area; absent when the case was not sized.\n"
[outputs.required_area_in2]
unit = "dimensionless"
optional = true
description = "the required area in square inches.\n"
[outputs.recommended_orifice]
type = "string"
optional = true
description = "the first standard orifice at or above the requirement; absent when not sized.\n"
[outputs.selected_area_in2]
unit = "dimensionless"
optional = true
description = "the selected standard orifice's area in square inches.\n"
[outputs.selected_orifice_capacity]
unit = "kg/s"
optional = true
description = "`rate selected_area / required_area`; absent when not sized.\n"
[outputs.capacity_adequate]
type = "boolean"
description = "whether the selected orifice is at least the required area.\n"
[outputs.acceptance_peak_pressure]
unit = "Pa"
optional = true
description = "the peak pressure the acceptance compared; absent when no credible scenario exists.\n"
[outputs.acceptance_allowable_pressure]
unit = "Pa"
optional = true
description = "`mawp + (mawp - atm) (accumulation_factor - 1)`.\n"
[outputs.acceptance_accumulation_factor]
unit = "dimensionless"
optional = true
description = "1.21 fire, 1.16 multiple non-fire, 1.10 single non-fire.\n"
[outputs.acceptance_margin]
unit = "Pa"
optional = true
description = "`allowable - peak`.\n"
[outputs.accepted]
type = "boolean"
optional = true
description = "whether the peak is at or below the allowable pressure; absent when no credible scenario exists.\n"
[outputs.messages]
type = "vector_string"
length = "one per message"
description = "the class's warning strings in order, with the acceptance failure's basis prose when it fails.\n"
[[valid_range]]
quantity = "mawp"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure must be positive"
[[valid_range]]
quantity = "relief_set_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure must be positive"
[[valid_range]]
quantity = "back_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a back pressure is non-negative"
[implementations]
python = "azoth.process.overpressure_protection_study"
rust = "azoth_process::overpressure_protection_study"
