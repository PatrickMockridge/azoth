id = "process.bow_tie"
name = "Bow-tie risk"
kind = "procedure"
assumptions = [
    "**the unmitigated frequency is the sum of the active threats' frequencies**, in caller order; an inactive threat contributes nothing.",
    "**the mitigated frequency multiplies the functional prevention barriers' PFDs in list order**, and only a `prevention` or `both` barrier takes part.",
    "**a `mitigation` barrier is read by no formula in the class's `calculateRisk`**, despite its name; the port carries the type because the class does, and states that it does not move the frequency.",
    "**the threat-to-barrier links are not read**: `linkBarrierToThreat` records an association for the presentation and no arithmetic, so every functional prevention barrier multiplies regardless of what it is linked to.",
    "**a barrier's effectiveness is `1 - PFD` and is read by no formula**, so the port does not carry it.",
    "**`total_rrf` is `unmitigated / mitigated`, and `0` when the mitigated frequency is zero**, the class's own answer; it is not `+Infinity`.",
    "**the maximum severity is the largest consequence severity, and zero when there are no consequences.**",
    "**the class validates no input**: a negative frequency, a PFD outside `[0, 1]` and a NaN are accepted and published. The port refuses all three.",
    "**an empty threat, consequence or barrier list is a state the class answers** — zero frequency, zero severity, or no reduction — so the port accepts it; a case cannot state an empty list, so that state is a capture evidence row and a hand test.",
]
references = [
    "IEC 61508-6:2010, annex F. The barrier and common-cause treatment.",
    "ISO 31010:2019. Risk management - Risk assessment techniques, annex B.20, bow-tie analysis.",
    "CCPS (2008). Guidelines for Hazard Evaluation Procedures, 3rd Ed.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/risk/bowtie/BowTieModel.java` is the port source.",
    "`validation/neqsim/captures/process_bow_tie.tsv` - the class's own test state, the mitigation barrier that does not move the frequency, the linked barrier that does not either, the empty states and the values the class accepts.",
]
[source]
standard = "NeqSim process/safety/risk/bowtie/BowTieModel.java"
edition = "Its `calculateRisk`, `getTotalRRF` and the `Threat`, `Consequence` and `Barrier` records."
[algorithm]
scheme = "closed_form_bow_tie"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.threats]
type = "record_list"
row_type = "BowTieThreat"
description = "the causes, in caller order; the frequency sum runs in this order. An empty list is a zero unmitigated frequency.\n"
[inputs.threats.fields.frequency]
unit = "dimensionless"
description = "the threat's frequency in 1/year, at least zero; the vocabulary has no year unit, so the value crosses unconverted.\n"
[inputs.threats.fields.active]
type = "boolean"
optional = true
description = "whether the threat contributes. **Absent is the class's `true`.**\n"
[inputs.consequences]
type = "record_list"
row_type = "BowTieConsequence"
description = "the outcomes; an empty list gives a maximum severity of zero.\n"
[inputs.consequences.fields.severity]
unit = "dimensionless"
description = "the consequence severity, a whole number at least zero.\n"
[inputs.barriers]
type = "record_list"
row_type = "BowTieBarrier"
description = "the barriers in caller order; the PFD product runs in this order. An empty list leaves the mitigated frequency equal to the unmitigated one.\n"
[inputs.barriers.fields.pfd]
unit = "dimensionless"
description = "the barrier's probability of failure on demand, in `[0, 1]`.\n"
[inputs.barriers.fields.barrier_type]
type = "enum"
values = ["prevention", "mitigation", "both"]
description = "only `prevention` and `both` multiply the frequency; `mitigation` is read by no formula.\n"
[inputs.barriers.fields.functional]
type = "boolean"
optional = true
description = "whether the barrier is functional. **Absent is the class's `true`**, and a non-functional barrier does not multiply.\n"
[outputs]
[outputs.unmitigated_frequency_per_year]
unit = "dimensionless"
description = "the sum of the active threats' frequencies, in 1/year.\n"
[outputs.mitigated_frequency_per_year]
unit = "dimensionless"
description = "the unmitigated frequency times the functional prevention barriers' PFDs, in 1/year.\n"
[outputs.total_rrf]
unit = "dimensionless"
description = "`unmitigated / mitigated`; zero when the mitigated frequency is zero.\n"
[outputs.max_severity]
unit = "dimensionless"
description = "the largest consequence severity, or zero when there are no consequences.\n"
[implementations]
python = "azoth.process.bow_tie"
rust = "azoth_process::bow_tie"
