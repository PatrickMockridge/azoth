id = "process.psv_valve"
name = "PSV latch and relief flow"
kind = "procedure"
assumptions = [
    "**one step of the class's `update` then `massFlowKgPerS`**, in that order. The valve's open state and pop count are the step's inputs, so a session loop is the caller's.",
    "**the latch**: the valve opens when closed and the upstream pressure reaches the set pressure, increments the pop count only on the closed-to-open transition, and closes only at or below the reseat pressure `set (1 - blowdown)`.",
    "**the flow** is the API 520 compressible-orifice relation with `R = 8.314`, choked at `(2/(gamma+1))^(gamma/(gamma-1))` and subcritical above it; the subcritical radicand is floored at 0 and a negative or NaN rate is published as 0.",
    "**a closed valve passes no flow**, whatever the upstream state.",
    "**the constructor's guards are mirrored**: a negative back pressure, a set pressure at or below it, a fraction outside `(0, 1)`, a non-positive coefficient or area is refused; the flow guards refuse a non-positive pressure, temperature, molar mass or compressibility and a ratio at or below one.",
    "**`reset()` is the state inputs**: `was_open = false` with `prior_cycle_count = 0`.",
    "**a negative or fractional `prior_cycle_count` is refused**, which the class cannot hold: its counter is a whole number, and a fractional one is not a state this step can continue from.",
]
references = [
    "API STD 520 Part I. Sizing, Selection, and Installation of Pressure-relieving Devices in Refineries.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/depressurization/PsvValveModel.java` is the port source, through `update` and `massFlowKgPerS`.",
    "`validation/neqsim/captures/process_psv_valve.tsv` - the hysteresis sequence, the pop count, the closed-flow state, the subcritical branch and the refusals.",
]
[source]
standard = "NeqSim process/safety/depressurization/PsvValveModel.java"
edition = "Its `update` and `massFlowKgPerS`: the API 520 open/reseat hysteresis, the cycle counter and the choked/subcritical orifice relation."
[algorithm]
scheme = "psv_latch_one_step"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.set_pressure]
unit = "Pa"
description = "the set (pop) pressure, absolute. Must exceed the back pressure.\n"
[inputs.blowdown_fraction]
unit = "dimensionless"
description = "the blowdown fraction in `(0, 1)` exclusive; the reseat pressure is `set_pressure (1 - blowdown_fraction)`.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
description = "the orifice discharge coefficient, typically 0.85 to 0.975. Must be positive.\n"
[inputs.orifice_area]
unit = "m**2"
description = "the effective orifice flow area. Must be positive.\n"
[inputs.back_pressure]
unit = "Pa"
description = "the downstream back pressure, absolute. Must be non-negative and below the set pressure.\n"
[inputs.upstream_pressure]
unit = "Pa"
description = "the upstream pressure at this step, absolute. Must be positive.\n"
[inputs.upstream_temperature]
unit = "K"
description = "the upstream temperature at this step. Must be positive.\n"
[inputs.molar_mass]
unit = "kg/mol"
description = "the relieving fluid's molar mass. Must be positive.\n"
[inputs.heat_capacity_ratio]
unit = "dimensionless"
description = "the isentropic exponent `Cp/Cv`. Must be greater than one.\n"
[inputs.compressibility]
unit = "dimensionless"
description = "the compressibility factor `Z`. Must be positive.\n"
[inputs.was_open]
type = "boolean"
optional = true
description = "the valve's open state before this step. **Absent is false.**\n"
[inputs.prior_cycle_count]
unit = "dimensionless"
optional = true
description = "the pop count before this step, a whole number at least 0. **Absent is 0.**\n"
[outputs]
[outputs.open]
type = "boolean"
description = "the valve's open state after the update.\n"
[outputs.cycle_count]
unit = "dimensionless"
description = "the pop count after the update.\n"
[outputs.mass_flow]
unit = "kg/s"
description = "the relieving mass flow at the upstream state; zero when the valve is closed.\n"
[[valid_range]]
quantity = "set_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive set pressure through the set > back guard"
[[valid_range]]
quantity = "blowdown_fraction"
min = 0
min_inclusive = false
max = 1
max_inclusive = false
severity = "error"
rationale = "the class refuses a blowdown fraction outside (0, 1)"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive discharge coefficient"
[[valid_range]]
quantity = "orifice_area"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive orifice area"
[[valid_range]]
quantity = "back_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "the class refuses a negative back pressure"
[[valid_range]]
quantity = "upstream_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive upstream pressure"
[[valid_range]]
quantity = "upstream_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive upstream temperature"
[[valid_range]]
quantity = "molar_mass"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive molar mass"
[[valid_range]]
quantity = "heat_capacity_ratio"
min = 1
min_inclusive = false
severity = "error"
rationale = "the class refuses a heat-capacity ratio at or below one"
[[valid_range]]
quantity = "compressibility"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class refuses a non-positive compressibility"
[[valid_range]]
quantity = "prior_cycle_count"
min = 0
min_inclusive = true
severity = "error"
rationale = "a counter cannot be negative"
[implementations]
python = "azoth.process.psv_valve"
rust = "azoth_process::psv_valve"
