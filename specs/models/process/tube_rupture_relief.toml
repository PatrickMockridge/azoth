id = "process.tube_rupture_relief"
name = "Tube rupture relief"
kind = "procedure"
assumptions = [
    "**the rupture area is the number of open ends times the tube's bore** `pi D^2 / 4`; a full-bore single-tube rupture presents two open ends, the class's default.",
    "**the discharging gas is the high-pressure fluid's state**: `getKappa`, molar mass and `Z` from a TP flash at the high-pressure side's pressure and the stated or default temperature. The class's explicit k/M path, for a caller with no fluid, is outside this id.",
    "**the flow is the isentropic nozzle through the rupture area**, choking where the pressure ratio is at or below the critical ratio; the low-pressure side defaults to 1.01325 bara and the discharge coefficient to 0.85.",
    "**vaporization and flashing on the low-pressure side are not modelled**, the class's own screening sentence; the high-pressure fluid's properties are used throughout.",
    "**a zero diameter answers zero** with the class's warning. A count below one is refused rather than silently reset to two: the class resets it and the area moves by a factor.",
]
references = [
    "TR3001. Overpressure protection, heat-exchanger tube rupture and SR-26616.",
    "API STD 521 (7th edition, 2020). Pressure-relieving and depressurizing systems, section 4.4.14.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/overpressure/TubeRuptureRelief.java` is the port source.",
    "`validation/neqsim/captures/process_tube_rupture_relief.tsv` - two ends, one end, a subcritical low-pressure side, the class's zero-end reset and the no-fluid branch.",
]
[source]
standard = "NeqSim process/safety/overpressure/TubeRuptureRelief.java"
edition = "Its `calculate` with a fluid, through `ReliefFluidState.evaluate` and `NozzleFlow.gasMassRateKgPerS`."
[algorithm]
scheme = "tube_rupture_nozzle"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.components]
type = "components"
description = "the high-pressure fluid's substances, by name, resolved against the component databank. The fluid is required: the relieving properties are a flash of it.\n"
[inputs.mole_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the high-pressure fluid's overall composition, summing to one.\n"
[inputs.tube_inner_diameter]
unit = "m"
description = "the tube's internal diameter, at least zero; the rupture area is its bore times the open ends.\n"
[inputs.high_pressure]
unit = "Pa"
description = "the high-pressure side's pressure, absolute and above zero.\n"
[inputs.number_of_open_ends]
unit = "dimensionless"
optional = true
description = "the open ends a full-bore single-tube rupture presents, at least one; absent is the class's 2.\n"
[inputs.high_temperature]
unit = "K"
optional = true
description = "the high-pressure side's temperature the fluid is flashed at, above zero; absent is the class's 288.15 K.\n"
[inputs.low_pressure]
unit = "Pa"
optional = true
description = "the low-pressure side into which the rupture discharges, at least zero; absent is the class's 1.01325 bara.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
optional = true
description = "the orifice discharge coefficient in `(0, 1]`; absent is 0.85.\n"
[inputs.scenario_name]
type = "string"
optional = true
description = "the scenario name carried on the result. Absent is the class's own `Tube rupture`.\n"
[outputs]
[outputs.name]
type = "string"
description = "the scenario name, echoed.\n"
[outputs.relief_rate]
unit = "kg/s"
description = "the isentropic nozzle flow through the rupture area.\n"
[outputs.phase]
type = "enum"
values = ["vapour", "liquid", "two_phase"]
description = "the relieving phase, which this cause hardcodes to `vapour`.\n"
[outputs.relief_temperature]
unit = "K"
description = "the high-pressure side's temperature, echoed.\n"
[outputs.molar_mass]
unit = "kg/mol"
description = "the relieving fluid's molar mass.\n"
[outputs.compressibility]
unit = "dimensionless"
description = "the relieving fluid's `Z`.\n"
[outputs.specific_heat_ratio]
unit = "dimensionless"
description = "the relieving fluid's `getKappa`, the isentropic exponent.\n"
[outputs.assumptions]
type = "vector_string"
length = "one per assumption"
description = "the class's assumption strings in order, with its warning strings appended.\n"
[[valid_range]]
quantity = "tube_inner_diameter"
min = 0
min_inclusive = true
severity = "error"
rationale = "a zero diameter is the class's defined zero-rate state"
[[valid_range]]
quantity = "high_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure must be positive"
[[valid_range]]
quantity = "number_of_open_ends"
min = 1
min_inclusive = true
severity = "error"
rationale = "a count below one is silently reset to two by the class, and the area moves by a factor"
[[valid_range]]
quantity = "high_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature must be positive"
[[valid_range]]
quantity = "low_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a low-pressure side is non-negative"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "a discharge coefficient is in (0, 1]"
[implementations]
python = "azoth.process.tube_rupture_relief"
rust = "azoth_process::tube_rupture_relief"
