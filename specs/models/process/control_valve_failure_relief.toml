id = "process.control_valve_failure_relief"
name = "Control valve failure relief"
kind = "procedure"
assumptions = [
    "**the fail-open flow is the isentropic nozzle through the valve's effective area** at the upstream pressure and the protected side's pressure, choking where the pressure ratio is at or below the critical ratio.",
    "**the area is the explicit `effective_area` when it is positive, else `Cv` times the erosion margin through the class's screening relation** `A_in2 = Cv / (24.6 Cd)`; an explicit area wins and the margin is not applied to it.",
    "**the discharging fluid is the upstream fluid's state**: `getKappa`, molar mass and `Z` come from a TP flash at the upstream pressure and the stated or default temperature. The class's explicit k/M path, for a caller with no fluid, is outside this id.",
    "**the class's defaults are the declaration's defaults**: the downstream pressure 1.01325 bara, the temperature 288.15 K and the discharge coefficient 0.85. A margin above one is reported as the class reports it.",
    "**an absent area and Cv answer zero** with the class's warning, and the fluid state's fallback warnings are carried in `assumptions` after the two authored rows.",
]
references = [
    "TR3001. Overpressure protection, control-valve failure and SR-26501.",
    "API STD 521 (7th edition, 2020). Pressure-relieving and depressurizing systems, section 4.4.9.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/overpressure/ControlValveFailureRelief.java` is the port source.",
    "`validation/neqsim/captures/process_control_valve_failure_relief.tsv` - explicit and Cv-derived areas, the erosion margin, a subcritical downstream, no area and the no-fluid branch.",
]
[source]
standard = "NeqSim process/safety/overpressure/ControlValveFailureRelief.java"
edition = "Its `calculate` with a fluid, through `ReliefFluidState.evaluate` and `NozzleFlow.gasMassRateKgPerS`."

[source.neqsim]
class = "ControlValveFailureRelief"
members = ["ControlValveFailureRelief.calculate"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[algorithm]
scheme = "control_valve_fail_open_nozzle"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.components]
type = "components"
description = "the upstream fluid's substances, by name, resolved against the component databank. The fluid is required: the relieving properties are a flash of it.\n"
[inputs.mole_fractions]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the upstream fluid's overall composition, summing to one.\n"
[inputs.upstream_pressure]
unit = "Pa"
description = "the upstream pressure, normally the maximum operating pressure, absolute and above zero.\n"
[inputs.upstream_temperature]
unit = "K"
optional = true
description = "the upstream temperature the fluid is flashed at, above zero; absent is the class's 288.15 K.\n"
[inputs.downstream_pressure]
unit = "Pa"
optional = true
description = "the protected low-pressure side, at least zero; absent is the class's 1.01325 bara.\n"
[inputs.effective_area]
unit = "m**2"
optional = true
description = "the fail-open effective flow area, at least zero. A positive value is used as stated.\n"
[inputs.cv]
unit = "dimensionless"
optional = true
description = "the valve flow coefficient, at least zero; read only when `effective_area` is absent or zero.\n"
[inputs.cv_erosion_margin]
unit = "dimensionless"
optional = true
description = "the multiplier on Cv for trim erosion or vibration, at least one; absent is 1.0.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
optional = true
description = "the orifice discharge coefficient in `(0, 1]`; absent is 0.85.\n"
[inputs.scenario_name]
type = "string"
optional = true
description = "the scenario name carried on the result. Absent is the class's own `Control valve failure`.\n"
[outputs]
[outputs.name]
type = "string"
description = "the scenario name, echoed.\n"
[outputs.relief_rate]
unit = "kg/s"
description = "the isentropic nozzle flow through the effective area.\n"
[outputs.phase]
type = "enum"
values = ["vapour", "liquid", "two_phase"]
description = "the relieving phase, which this cause hardcodes to `vapour`.\n"
[outputs.relief_temperature]
unit = "K"
description = "the upstream temperature, echoed.\n"
[outputs.molar_mass]
unit = "kg/mol"
description = "the relieving fluid's molar mass.\n"
[outputs.compressibility]
unit = "dimensionless"
description = "the relieving fluid's `Z`.\n"
[outputs.specific_heat_ratio]
unit = "dimensionless"
description = "the relieving fluid's `getKappa`, the isentropic exponent.\n"
[outputs.assumptions]
type = "vector_string"
length = "one per assumption"
description = "the class's assumption strings in order, with its warning strings appended.\n"
[[valid_range]]
quantity = "upstream_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure must be positive"
[[valid_range]]
quantity = "upstream_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature must be positive"
[[valid_range]]
quantity = "downstream_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a downstream pressure is non-negative"
[[valid_range]]
quantity = "effective_area"
min = 0
min_inclusive = true
severity = "error"
rationale = "an area is non-negative; a zero falls through to Cv or to the zero-rate warning"
[[valid_range]]
quantity = "cv"
min = 0
min_inclusive = true
severity = "error"
rationale = "a flow coefficient is non-negative"
[[valid_range]]
quantity = "cv_erosion_margin"
min = 1
min_inclusive = true
severity = "error"
rationale = "a margin below one would shrink the capacity the class's setter says it grows"
[[valid_range]]
quantity = "discharge_coefficient"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "a discharge coefficient is in (0, 1]"
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim ControlValveFailureRelief.calculate"

[provenance.algorithm.convergence]
source = "NeqSim ControlValveFailureRelief.calculate"

[provenance.algorithm.max_iterations]
source = "NeqSim ControlValveFailureRelief.calculate"

[provenance.algorithm.scheme]
source = "NeqSim ControlValveFailureRelief.calculate"

[provenance.algorithm.tolerance]
source = "NeqSim ControlValveFailureRelief.calculate"

[implementations]
python = "azoth.process.control_valve_failure_relief"
rust = "azoth_process::control_valve_failure_relief"
