id = "process.non_equilibrium_blowdown"
name = "Non-equilibrium blowdown"
kind = "procedure"
assumptions = [
    "**the class's `run`**: the initial two-phase feed is charged to the vessel volume, split into vapour and liquid zones, and marched with each zone flashed at its own temperature and the shared pressure.",
    "**the pressure is set by a TV flash of the vapour zone at `V - v_liquid`**, floored at the back pressure.",
    "**the wall area is split by the wetted fraction `v_liquid / V`**; the wetted wall drives Rohsenow nucleate boiling capped at `critical_heat_flux`, and an interfacial term couples the zones.",
    "**the boil-off is `min(max(q_wetted, 0) dt / latent_heat, 0.5 m_liquid)`**, transferred from the liquid zone to the vapour zone with the liquid's composition.",
    "**the zone temperatures are clamped**: a 100 K floor, the wall at or below the flame temperature, the vapour at or below the wall, and the liquid at or below the warmer of the wall and the vapour.",
    "**a zone flash failure breaks the march** and increments the fallback count rather than aborting.",
    "**`fire_exposed_area = 0` derives `4 V^(2/3)`**, `interfacial_area = 0` derives `V^(2/3)` and `wall_mass = 0` derives 1 kg, the class's defaults; there is no fire-off switch.",
    "**the class's viscosity and conductivity are the PFCT dispatch**; a missing property falls back to the effective boiling coefficient.",
]
references = [
    "Haque, M. A.; Richardson, S. M.; Saville, G. (1992). Blowdown of pressure vessels. Transactions of the IChemE, 70(B).",
    "Rohsenow, W. M. (1952). A method of correlating heat transfer data for surface boiling of liquids. Transactions of the ASME, 74.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/depressurization/NonEquilibriumBlowdownModel.java` is the port source, through `run`.",
    "`validation/neqsim/captures/process_non_equilibrium_blowdown.tsv` - a fire-exposed two-phase inventory, the default-parameter state and the single-phase-feed refusal.",
]
[source]
standard = "NeqSim process/safety/depressurization/NonEquilibriumBlowdownModel.java"
edition = "Its `run`: the zone split, the vapour-controlled pressure, the wetted-wall boiling, the interfacial coupling, the boil-off and the clamps."
[algorithm]
scheme = "explicit_euler_two_zone_blowdown"
convergence = "relative"
tolerance = 1.0e-12
max_iterations = 1000000
[inputs]
[inputs.components]
type = "components"
description = "the vessel inventory's substances, by name, resolved against the component databank.\n"
[inputs.initial_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the inventory's composition; the feed must split into vapour and liquid.\n"
[inputs.initial_t]
unit = "K"
description = "the inventory temperature before blowdown.\n"
[inputs.initial_p]
unit = "Pa"
description = "the inventory pressure before blowdown.\n"
[inputs.vessel_volume]
unit = "m**3"
description = "the vessel's internal volume. Must be positive.\n"
[inputs.orifice_diameter]
unit = "m"
description = "the blowdown opening's diameter. Must be positive.\n"
[inputs.discharge_coefficient]
unit = "dimensionless"
description = "the orifice coefficient. Must be positive.\n"
[inputs.back_pressure]
unit = "Pa"
description = "the receiving absolute pressure; the pressure is floored at it.\n"
[inputs.fire_emissivity]
unit = "dimensionless"
optional = true
description = "the effective flame emissivity. **Absent takes 0.9.**\n"
[inputs.fire_flame_temperature]
unit = "K"
optional = true
description = "the effective radiating flame temperature. **Absent takes 1100 K.**\n"
[inputs.fire_convective_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the flame-to-wall convection coefficient. **Absent takes 30.**\n"
[inputs.fire_exposed_area]
unit = "m**2"
optional = true
description = "the fire-exposed external area. **Absent derives `4 V^(2/3)`.**\n"
[inputs.wall_mass]
unit = "kg"
optional = true
description = "the lumped wall mass. **Absent derives 1 kg.**\n"
[inputs.wall_specific_heat]
unit = "J/(kg*K)"
optional = true
description = "the wall metal's specific heat. **Absent takes 470.**\n"
[inputs.inside_gas_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the vapour-side film coefficient. **Absent takes 30.**\n"
[inputs.interfacial_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the gas-liquid interfacial coefficient. **Absent takes 200.**\n"
[inputs.interfacial_area]
unit = "m**2"
optional = true
description = "the interfacial area. **Absent derives `V^(2/3)`.**\n"
[inputs.latent_heat]
unit = "dimensionless"
optional = true
description = "the latent heat in J/kg, declared dimensionless. **Absent takes 350000.**\n"
[inputs.surface_tension]
unit = "dimensionless"
optional = true
description = "the surface tension in N/m, declared dimensionless. **Absent takes 0.015.**\n"
[inputs.surface_fluid_constant]
unit = "dimensionless"
optional = true
description = "the Rohsenow surface-fluid constant. **Absent takes 0.011.**\n"
[inputs.critical_heat_flux]
unit = "dimensionless"
optional = true
description = "the critical heat flux in W/m2, declared dimensionless. **Absent takes 1e6.**\n"
[inputs.effective_boiling_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the effective boiling coefficient's fallback. **Absent takes 5000.**\n"
[inputs.time_step]
unit = "s"
optional = true
description = "the explicit step. **Absent takes 1 s.**\n"
[inputs.max_time]
unit = "s"
optional = true
description = "the horizon. **Absent takes 900 s.**\n"
[inputs.stop_pressure]
unit = "Pa"
optional = true
description = "the pressure at which the march stops. **Absent takes 1.5e5 Pa.**\n"
[outputs]
[outputs.points]
type = "record_list"
description = "one row per step, in time order.\n"
[outputs.points.fields.time]
unit = "s"
description = "the step's time.\n"
[outputs.points.fields.pressure]
unit = "Pa"
description = "the shared pressure.\n"
[outputs.points.fields.gas_temperature]
unit = "K"
description = "the vapour-zone temperature.\n"
[outputs.points.fields.liquid_temperature]
unit = "K"
description = "the liquid-zone temperature.\n"
[outputs.points.fields.wall_temperature]
unit = "K"
description = "the wall metal temperature.\n"
[outputs.points.fields.gas_mass]
unit = "kg"
description = "the vapour-zone mass.\n"
[outputs.points.fields.liquid_mass]
unit = "kg"
description = "the liquid-zone mass.\n"
[outputs.initial_pressure]
unit = "Pa"
description = "the initial pressure.\n"
[outputs.flash_fallback_count]
unit = "dimensionless"
description = "the steps that hit a guarded flash failure.\n"
[outputs.final_gas_temperature]
unit = "K"
description = "the final vapour-zone temperature.\n"
[outputs.final_liquid_temperature]
unit = "K"
description = "the final liquid-zone temperature.\n"
[outputs.max_temperature_bifurcation]
unit = "K"
description = "the largest vapour-minus-liquid temperature difference.\n"
[outputs.recorded_points]
unit = "dimensionless"
description = "the recorded rows.\n"
[implementations]
python = "azoth.process.non_equilibrium_blowdown"
rust = "azoth_process::non_equilibrium_blowdown"
