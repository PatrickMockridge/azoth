id = "process.s001_secondary_pressure_protection"
name = "NORSOK S-001 secondary pressure protection"
kind = "procedure"
assumptions = [
    "**the default target frequency follows the class's pressure bands**: event `> 2 design` gives `1e-5` per year, `> test` gives `1e-4`, `> design` gives `1e-3`, else `1e-2`. The band resolves only when all three pressures are finite and positive; a stated target overrides it.",
    "**the two pressure checks are vacuous-true without a basis**, but `acceptable` also requires the basis; `test_pressure_valid` is test `>=` design and `pressure_within_test` is event `<=` test.",
    "**the frequency is configured when the demand is finite and at least zero and the resolved target is finite**; the criterion is demand `<=` target. Without a configured frequency the criterion is vacuous-true but `acceptable` is false.",
    "**the two leakage flags are `true`-only**: absent and false both fail. The proof-test interval is configured when stated; its criterion is at most twelve months, and an absent interval is not a failure of the criterion.",
    "**the pressures are declared in Pa**; only their ratios matter to the bands, so the answer is the same as the class's bara. No month unit exists, so the interval is dimensionless.",
    "**measured divergence: the class's `<= 12` test passes a negative or zero proof-test interval**, so it answers acceptable where the interval is nonsense. The port refuses a non-positive interval and keeps both class answers in the capture.",
    "**the class's `fromItem` alias mapping and `isEmpty` are adapter state**: the id takes the eight criteria directly.",
]
references = [
    "NORSOK S-001:2020+AC:2021, clause 10.4.7. Secondary pressure protection.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/processsafetysystem/S001SecondaryPressureProtectionCriteria.java` is the port source.",
    "`validation/neqsim/captures/process_s001_secondary_pressure_protection.tsv` - the four bands, the complete pass, the missing-basis, leakage and target states, the proof-test intervals 6, 13, -6 and 0, and the empty criteria.",
]
[source]
standard = "NeqSim process/safety/processsafetysystem/S001SecondaryPressureProtectionCriteria.java"
edition = "Its `evaluate` and `getDefaultTargetFrequencyPerYear`."

[source.neqsim]
class = "S001SecondaryPressureProtectionCriteria"
members = ["S001SecondaryPressureProtectionCriteria.evaluate"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[algorithm]
scheme = "norsok_s001_secondary_pressure_protection"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 1
[inputs]
[inputs.maximum_event_pressure]
unit = "Pa"
optional = true
description = "the maximum event pressure, at least zero. **Absent is the class's NaN** and leaves the basis incomplete.\n"
[inputs.design_pressure]
unit = "Pa"
optional = true
description = "the protected equipment's design pressure, at least zero.\n"
[inputs.test_pressure]
unit = "Pa"
optional = true
description = "the pressure-test pressure, at least zero.\n"
[inputs.demand_frequency_per_year]
unit = "dimensionless"
optional = true
description = "the annual demand frequency, at least zero. **Absent leaves the frequency unconfigured.**\n"
[inputs.target_frequency_per_year]
unit = "dimensionless"
optional = true
description = "the stated target frequency per year, at least zero; it overrides the band. Absent resolves the band.\n"
[inputs.relief_leakage_assessed]
type = "boolean"
optional = true
description = "whether relief leakage has been assessed. **Absent and false both fail**; only true satisfies the criterion.\n"
[inputs.relief_leakage_to_safe_location]
type = "boolean"
optional = true
description = "whether the relief leakage is routed to a safe location. **Absent and false both fail.**\n"
[inputs.proof_test_interval_months]
unit = "dimensionless"
optional = true
description = "the proof-test interval in months, above zero. **Absent leaves the interval unconfigured**, which does not fail the criterion.\n"
[outputs]
[outputs.target_frequency_per_year]
unit = "dimensionless"
optional = true
description = "the resolved target frequency, stated or from the band. **Absent when the band cannot resolve**: a missing or non-positive pressure basis with no stated target.\n"
[outputs.pressure_basis_complete]
type = "boolean"
description = "whether all three pressures are finite and positive.\n"
[outputs.test_pressure_valid]
type = "boolean"
description = "whether the test pressure is at or above the design pressure; vacuous-true without a basis.\n"
[outputs.pressure_within_test]
type = "boolean"
description = "whether the event pressure is at or below the test pressure; vacuous-true without a basis.\n"
[outputs.frequency_configured]
type = "boolean"
description = "whether the demand and the resolved target are configured.\n"
[outputs.frequency_criterion_met]
type = "boolean"
description = "whether the demand is at or below the target; vacuous-true when unconfigured.\n"
[outputs.leakage_assessed]
type = "boolean"
description = "whether relief leakage has been assessed.\n"
[outputs.leakage_routed_safe]
type = "boolean"
description = "whether the leakage is routed to a safe location.\n"
[outputs.proof_test_configured]
type = "boolean"
description = "whether a proof-test interval is stated.\n"
[outputs.proof_test_criterion_met]
type = "boolean"
description = "whether the interval is at most twelve months; vacuous-true when unconfigured.\n"
[outputs.acceptable]
type = "boolean"
description = "whether every criterion is met.\n"
[[valid_range]]
quantity = "maximum_event_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative pressure is not a basis"
[[valid_range]]
quantity = "design_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative pressure is not a basis"
[[valid_range]]
quantity = "test_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative pressure is not a basis"
[[valid_range]]
quantity = "demand_frequency_per_year"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative annual frequency is not a demand"
[[valid_range]]
quantity = "target_frequency_per_year"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative annual frequency is not a target"
[[valid_range]]
quantity = "proof_test_interval_months"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class's `<= 12` test passes zero and negative intervals; a proof-test interval must be positive, and the capture keeps the class's answer at -6 and 0 as the divergence evidence"
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim S001SecondaryPressureProtectionCriteria.evaluate"

[provenance.algorithm.convergence]
source = "NeqSim S001SecondaryPressureProtectionCriteria.evaluate"

[provenance.algorithm.max_iterations]
source = "NeqSim S001SecondaryPressureProtectionCriteria.evaluate"

[provenance.algorithm.scheme]
source = "NeqSim S001SecondaryPressureProtectionCriteria.evaluate"

[provenance.algorithm.tolerance]
source = "NeqSim S001SecondaryPressureProtectionCriteria.evaluate"

[implementations]
python = "azoth.process.s001_secondary_pressure_protection"
rust = "azoth_process::s001_secondary_pressure_protection"
