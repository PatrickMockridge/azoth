id = "eos.state_at_tp"
name = "Thermodynamic state at a temperature and pressure"
kind = "procedure"
assumptions = [
    "**one flash, then the properties at its answer.** The split is `eos.pt_flash_check`'s; the volumetric and caloric properties are `eos.molar_enthalpy_entropy`'s, the heat capacity `phase_capacity`'s, each at its phase's root and weighted by vapour fraction.",
    "A component's `Tc`, `Pc`, `omega`, molar mass and every `kij` come from the databank with the keycard's overrides applied; a keycard-defined pseudo-component therefore travels through the same path as a databank substance.",
    "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses.",
    "**the phase class is a screening label, not a stability analysis.** `two_phase` is the flash's split; the single-phase labels are its verdicts; the dense labels mark a state at or above the mixture's Kay pseudo-critical pressure, and `dense_supercritical` above its temperature.",
    "`tolerance` overrides the flash's outer stopping tolerance; `strict` is true when absent. `strict = false` returns the last iterate with `converged = false` and a warning, as `eos.pt_flash_check` does.",
    "`system_sound_speed` and `interface_tension` are optional and absent in this tranche; a caller wanting either calls `eos.equilibrium_sound_speed` or the surface-tension model. Absent is not zero.",
    "the enthalpy and internal energy are absolute from the ideal-gas model's datum (273.15 K, no formation enthalpy), so a caller uses differences. The datum cancels in every balance this state feeds.",
]
references = [
    "Michelsen, M. L. (1982). \"The isothermal flash problem. Part I. Stability.\" Fluid Phase Equilibria 9(1), 1-19. DOI 10.1016/0378-3812(82)85001-2.",
    "NeqSim master `twophasepipe/ThermodynamicCoupling.java`, whose `ThermoProperties` aggregates per-phase density, enthalpy, cp, sound speed and surface tension after a `TPflash`. NeqSim has no all-in-one state method; this is an aggregate, not a port.",
]
[source]
standard = "Michelsen, M. L. (1982); NeqSim `ThermodynamicCoupling.ThermoProperties`"
edition = "The flash of `eos.pt_flash_check`, then the per-phase properties at its answer. The Kay pseudo-critical classification is azoth's screening label; NeqSim's `PhaseType` has no supercritical or dense member."
doi = "10.1016/0378-3812(82)85001-2"
[algorithm]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[algorithm.fallback]
after = 25
[algorithm.fallback.algorithm]
scheme = "isofugacity_newton"
initialisation = "from_the_outer_scheme"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 25
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank with the keycard's overrides applied."
[inputs.T]
unit = "K"
description = "absolute temperature."
[inputs.P]
unit = "Pa"
description = "absolute pressure."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "overall mole fractions. Checked rather than renormalised."
[inputs.tolerance]
unit = "dimensionless"
optional = true
description = "the flash's outer stopping tolerance; absent takes `algorithm.tolerance`, 1e-10."
[inputs.strict]
type = "boolean"
optional = true
description = "whether a flash cap raises; absent is true. False reports `converged = false`."
[outputs]
[outputs.phase]
type = "enum"
values = ["two_phase", "all_liquid", "all_vapour", "trivial"]
description = "what the flash found."
[outputs.phase_class]
type = "enum"
values = ["two_phase", "single_phase_gas", "single_phase_liquid", "dense_single_phase", "dense_supercritical", "undetermined"]
description = "the screening label; see the assumptions."
[outputs.converged]
type = "boolean"
description = "whether the flash met its tolerance."
[outputs.vapour_fraction]
unit = "dimensionless"
optional = true
description = "the vapour fraction where there is a split; absent for a single phase."
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions; equal to the feed when single phase."
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions; equal to the feed when single phase."
[outputs.molar_mass]
unit = "kg/mol"
description = "bulk molar mass."
[outputs.molar_volume]
unit = "m**3/mol"
description = "bulk molar volume, phase-fraction weighted."
[outputs.density]
unit = "kg/m**3"
description = "bulk mass density, the molar mass over the molar volume."
[outputs.internal_energy]
unit = "J/mol"
description = "bulk molar internal energy, `h - P v`."
[outputs.enthalpy]
unit = "J/mol"
description = "bulk molar enthalpy."
[outputs.cp]
unit = "J/(mol*K)"
description = "bulk molar isobaric heat capacity."
[outputs.cv]
unit = "J/(mol*K)"
description = "bulk molar isochoric heat capacity."
[outputs.compressibility]
unit = "dimensionless"
description = "bulk compressibility `P v / (R T)`."
[outputs.system_sound_speed]
unit = "m/s"
optional = true
description = "absent in this tranche; the caller uses `eos.equilibrium_sound_speed`."
[outputs.interface_tension]
unit = "N/m"
optional = true
description = "absent in this tranche; the caller uses the surface-tension model."
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a stopping tolerance; zero can never be met"
[implementations]
python = "azoth.eos.state_at_tp"
rust = "azoth_eos::state_at_tp"
