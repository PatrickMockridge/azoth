[inputs]
[inputs.components]
type = "components"
description = "the fluid's substances, by name, resolved against the component databank.\n"
[inputs.inlet_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's overall mole fractions, which every cell flash holds.\n"
[inputs.inlet_mass_flow]
unit = "kg/s"
description = "the inlet stream's mass flow, which initialises the superficial velocities; a closed inlet still reads it for the initial state.\n"
[inputs.inlet_p]
unit = "Pa"
description = "the inlet stream's pressure, which is the initial inlet cell's pressure.\n"
[inputs.inlet_t]
unit = "K"
description = "the inlet stream's temperature, held by every cell for the isothermal march.\n"
[inputs.length]
unit = "m"
description = "the line's total length.\n"
[inputs.diameter]
unit = "m"
description = "the internal diameter.\n"
[inputs.number_of_sections]
unit = "dimensionless"
description = "the number of computational cells; `dx` is the length over this.\n"
[inputs.roughness]
unit = "m"
description = "the wall's absolute roughness.\n"
[inputs.inlet_boundary]
type = "enum"
values = ["constant_flow", "constant_pressure", "closed"]
description = "the inlet boundary arm.\n"
[inputs.outlet_boundary]
type = "enum"
values = ["constant_pressure", "constant_flow", "closed"]
description = "the outlet boundary arm.\n"
[inputs.elevation_profile]
type = "vector"
unit = "m"
length = "one per section"
optional = true
description = "each cell's elevation. Absent is a flat line. A local minimum is an accumulation zone and is refused.\n"
[inputs.inclination_profile]
type = "vector"
unit = "dimensionless"
length = "one per section, in radians"
optional = true
description = "each cell's inclination, used only when no elevation profile is given. Absent is a flat line. A riser-base transition is refused.\n"
[inputs.outlet_pressure]
unit = "Pa"
optional = true
description = "the constant outlet pressure. Absent is the class's hydrostatic and friction estimate from the inlet state, floored at 1 bar.\n"
[inputs.max_simulation_time]
unit = "s"
optional = true
description = "the march's end. **Absent is the class's 3600 s.**\n"
[inputs.cfl]
unit = "dimensionless"
optional = true
description = "the CFL number. **Absent is the class's 0.5.**\n"
[inputs.thermodynamic_update_interval]
unit = "dimensionless"
optional = true
description = "the number of steps between cell flashes. **Absent is the class's 10.**\n"
[inputs.eos]
type = "enum"
values = ["srk", "pr"]
optional = true
description = "the cubic. **Absent is `srk`.**\n"
[outputs]
[outputs.pressure_profile]
type = "vector"
unit = "Pa"
length = "one per section"
description = "each cell's final pressure, `getPressureProfile`.\n"
[outputs.temperature_profile]
type = "vector"
unit = "K"
length = "one per section"
description = "each cell's final temperature, `getTemperatureProfile`; the held inlet temperature.\n"
[outputs.liquid_holdup_profile]
type = "vector"
unit = "dimensionless"
length = "one per section"
description = "each cell's final liquid holdup, `getLiquidHoldupProfile`.\n"
[outputs.gas_velocity_profile]
type = "vector"
unit = "m/s"
length = "one per section"
description = "each cell's final gas velocity, `getGasVelocityProfile`.\n"
[outputs.liquid_velocity_profile]
type = "vector"
unit = "m/s"
length = "one per section"
description = "each cell's final liquid velocity, `getLiquidVelocityProfile`.\n"
[outputs.pressure_history]
type = "matrix"
unit = "Pa"
shape = "one row per allocated sample, one column per section"
description = "`getPressureHistory`: the allocated matrix, the initial row first, a row every ten steps while the allocation lasts, and zero in the rows never written.\n"
[outputs.simulation_time]
unit = "s"
description = "`getSimulationTime`: the last step's accumulated time, which may pass `max_simulation_time` by one step.\n"
[outputs.total_time_steps]
unit = "dimensionless"
description = "`getTotalTimeSteps`: the adaptive steps the march took.\n"
[outputs.mass_inventory]
unit = "kg"
description = "`getMassResidual`: the class's name for the summed mixture mass, not a residual.\n"
[[valid_range]]
quantity = "inlet_mass_flow"
min = 0
min_inclusive = true
severity = "error"
rationale = "a closed inlet has no flow, and the class initialises a stagnant state from a zero stream.\n"
[[valid_range]]
quantity = "inlet_p"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure.\n"
[[valid_range]]
quantity = "inlet_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature.\n"
[[valid_range]]
quantity = "length"
min = 0
min_inclusive = false
severity = "error"
rationale = "the line has a length.\n"
[[valid_range]]
quantity = "diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the cells have an area.\n"
[[valid_range]]
quantity = "number_of_sections"
min = 1
min_inclusive = true
severity = "error"
rationale = "at least one cell.\n"
[[valid_range]]
quantity = "roughness"
min = 0
min_inclusive = true
severity = "error"
rationale = "an absolute roughness cannot be negative.\n"
[[valid_range]]
quantity = "max_simulation_time"
min = 0
min_inclusive = false
severity = "error"
rationale = "a march has a positive duration.\n"
[[valid_range]]
quantity = "cfl"
min = 0
min_inclusive = false
severity = "error"
rationale = "a positive CFL number.\n"
[[valid_range]]
quantity = "thermodynamic_update_interval"
min = 1
min_inclusive = true
severity = "error"
rationale = "a flash every positive number of steps.\n"
[[valid_range]]
quantity = "outlet_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure.\n"

