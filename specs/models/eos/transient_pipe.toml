id = "eos.transient_pipe"
name = "Transient drift-flux pipeline march"
kind = "direct"
assumptions = [
    "**the march is `TransientPipe.run`'s isothermal path**: `includeHeatTransfer` is false, so temperature is held and the energy flux is never read back.\n",
    "**`gasBeta` is the gas phase's mole fraction** and splits the inlet mass flow; the initial holdup is `U_SL/(U_SL+U_SG)`, as the class computes it.\n",
    "**each cell is flashed every `thermodynamic_update_interval` steps** at its pressure and the inlet temperature; `TPflash` dispatches to `TPmultiflash` under `setMultiPhaseCheck(true)`.\n",
    "**phase density is `M/V` with Peneloux; surface tension is the mixture Parachor with gas first.** The label is `V/b > 1.75`, and no second mN/m conversion is applied.\n",
    "**the pressure update is the class's acoustic relation**, `p_new = p_old + c^2 (rho_new - rho_old)`, with the 5 % density and pressure caps and the `[1e5, 5e7]` Pa bounds.\n",
    "**the class's specific enthalpy is `getEnthalpy(\"J/mol\") / getMolarMass() * 1000`**, 1000 times the J/kg value; in the isothermal path it reaches only the unread energy variable.\n",
    "**gas plus at most one liquid.** A three-phase flash, the slug and accumulation trackers, heat transfer and the transient boundaries are refused.\n",
    "**the supported boundaries are `CONSTANT_FLOW`, `CONSTANT_PRESSURE` and `CLOSED`**; the model is one `run()` to `max_simulation_time`, not an incremental `runTransient`.\n",
    "**the history is the class's preallocated matrix**, `int(maxSimulationTime/(dt*historyInterval))+1` rows at 0.1 s and 10, written every ten steps; unwritten rows stay zero.\n",
    "**the class's split is its own code**: `splitMachPlus` and `splitMachMinus` omit the `beta (M^2 - 1)^2` term their comment names.\n",
]
references = [
    "NeqSim master, `process/equipment/pipeline/twophasepipe/TransientPipe.java`, `DriftFluxModel.java`, `FlowRegimeDetector.java` and `PipeSection.java`, Apache-2.0, commit b40bb1134508faa24b07aed9a23c4d52865e5c2a.",
    "Taitel, Y. and Dukler, A. E. (1976), AIChE Journal 22(1); Barnea, D. (1987), Int. J. Multiphase Flow 13(1); Bendiksen, K. H. (1984), Int. J. Multiphase Flow 10(4); Zuber, N. and Findlay, J. A. (1965), J. Heat Transfer 87(4) - the regime map and drift-flux closures the class cites.",
    "Liou, M.-S. (1996), J. Comput. Phys. 129 - the AUSM+ split the class names, whose `beta` term its code omits.",
    "`validation/neqsim/captures/transient_pipe.tsv` - the class on a 100 m, 100 mm, five-cell methane/n-butane line, a flowing inlet and a closed inlet, at the pinned jar.",
]
[source]
standard = "NeqSim master `TransientPipe`"
edition = "`run`'s isothermal drift-flux march: the CFL step, finite-volume update, class face split, drift-flux split, acoustic pressure update, three boundaries, periodic TP flash, profiles and history. Heat transfer, slug/accumulation, three-phase and transient boundaries are outside this model."

