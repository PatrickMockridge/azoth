id = "eos.pt_flash_check"
name = "Pressure-temperature flash with a convergence flag"
kind = "procedure"
assumptions = [
    "**this is `eos.pt_flash` with the contract a time march needs.** It runs the same successive-substitution and second-order procedures, with the same Wilson start and trivial-solution test, and adds a caller-set tolerance and a non-throwing mode; the arithmetic is not a second flash.",
    "A component's `Tc`, `Pc`, `omega` and every `kij` come from the databank with the keycard's overrides applied, exactly as `eos.pt_flash` reads them.",
    "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses.",
    "`tolerance` overrides `algorithm.tolerance` for the outer stopping rule and the final acceptance; the fallback Newton keeps its own declared tolerance unless `tolerance` is supplied, in which case the supplied value is the acceptance for both.",
    "`strict` is true when absent. False turns the iteration cap into a result: the last iterate is returned with `converged = false` and a `SOLVER_NOT_CONVERGED` warning. A non-finite K-value still raises under either setting, because a diverged iteration is not a state.",
    "There is no stability test: a converged split is a stationary point of the flash equations, not a proof that the feed was unstable.",
]
references = [
    "Rachford, H. H.; Rice, J. D. (1952). \"Procedure for Use of Electronic Digital Computers in Calculating Flash Vaporization Hydrocarbon Equilibrium.\" Journal of Petroleum Technology 4(10), 19-3. DOI 10.2118/952327-G",
    "Michelsen, M. L. (1982). \"The isothermal flash problem. Part I. Stability.\" Fluid Phase Equilibria 9(1), 1-19. DOI 10.1016/0378-3812(82)85001-2.",
    "NeqSim master `thermodynamicoperations/flashops/TPflash.java`, whose outer loop has no tolerance setter and exits silently at its iteration cap; the convergence flag is azoth's contract, not a ported NeqSim API.",
]
[source]
standard = "Rachford, H. H.; Rice, J. D. (1952); Michelsen, M. L. (1982)"
edition = "The same procedure as `eos.pt_flash`, with the caller's tolerance and a non-throwing cap. NeqSim's `TPflash` is the source of the scheme; it has no public tolerance or convergence-flag setter, so the diagnostic contract is azoth's."
doi = "10.1016/0378-3812(82)85001-2"
[algorithm]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[algorithm.fallback]
after = 25
[algorithm.fallback.algorithm]
scheme = "isofugacity_newton"
initialisation = "from_the_outer_scheme"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 25
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank with the keycard's overrides applied."
[inputs.T]
unit = "K"
description = "absolute temperature."
[inputs.P]
unit = "Pa"
description = "absolute pressure."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "overall mole fractions. Checked rather than renormalised."
[inputs.tolerance]
unit = "dimensionless"
optional = true
description = "the outer stopping tolerance; absent takes `algorithm.tolerance`, 1e-10."
[inputs.strict]
type = "boolean"
optional = true
description = "whether a cap raises; absent is true. False returns the last iterate with `converged = false`."
[outputs]
[outputs.vapour_fraction]
unit = "dimensionless"
optional = true
description = "The vapour fraction, in `[0, 1]` for a two-phase split; outside that it is the negative-flash value and the feed is single phase. Absent where there is genuinely no vapour fraction."
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions"
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "`K_i = y_i / x_i = phi_i^L / phi_i^V`."
[outputs.ln_phi_liquid]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "fugacity coefficients in the liquid phase, as logarithms."
[outputs.ln_phi_vapour]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "fugacity coefficients in the vapour phase, as logarithms."
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the liquid composition."
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root at the vapour composition."
[outputs.min_t_over_tc]
unit = "dimensionless"
description = "the smallest `T / Tc_i` over the components."
[outputs.phase]
type = "enum"
values = ["two_phase", "all_liquid", "all_vapour", "trivial"]
description = "What the state is: `two_phase`, `all_liquid`, `all_vapour`, or `trivial` (the iteration converged to `x = y = z`)."
[outputs.converged]
type = "boolean"
description = "whether the iteration met its tolerance, or settled on a trivial or single-phase state by proof. False only when `strict = false` and the loop hit its cap; the split is then the last iterate, not a converged state."
[outputs.iterations]
unit = "dimensionless"
description = "outer steps taken."
[outputs.residual]
unit = "dimensionless"
description = "the last step's convergence measure."
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a stopping tolerance; zero can never be met and a negative value is not a distance"
[[valid_range]]
quantity = "min_t_over_tc"
max = 0.9
max_inclusive = true
severity = "warning"
rationale = "Above `T / Tc = 0.9` for the nearest component the cubic's roots are close to coalescing and successive substitution converges slowly or to the trivial solution."
[implementations]
python = "azoth.eos.pt_flash_check"
rust = "azoth_eos::pt_flash_check"
