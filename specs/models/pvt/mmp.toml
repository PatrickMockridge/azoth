[inputs.temperature]
unit = "K"
description = "the experiment temperature.\n"
[inputs.eos]
type = "enum"
values = ["srk", "pr"]
optional = true
description = "the cubic; absent is srk.\n"
[inputs.mixing_rule]
type = "enum"
values = ["classic", "zero"]
optional = true
description = "the interaction matrix; absent is classic.\n"
[inputs.method]
type = "enum"
values = ["slim_tube", "key_tie_line", "rising_bubble"]
optional = true
description = "the MMP method; absent is slim_tube.\n"
[inputs.recovery_threshold]
unit = "dimensionless"
optional = true
description = "the recovery fraction defining the MMP; absent is 0.90.\n"
[inputs.number_of_pressure_points]
unit = "dimensionless"
optional = true
description = "the slim tube's pressure grid points; absent is 10.\n"
[inputs.min_pressure]
unit = "Pa"
optional = true
description = "the pressure range's lower bound; absent is 100 bar.\n"
[inputs.max_pressure]
unit = "Pa"
optional = true
description = "the pressure range's upper bound; absent is 500 bar.\n"
[inputs.slim_tube_nodes]
unit = "dimensionless"
optional = true
description = "the slim tube's cells; absent is 100.\n"
[inputs.pv_injected]
unit = "dimensionless"
optional = true
description = "the injected pore volumes; absent is 1.2.\n"
[outputs]
[outputs.mmp]
unit = "Pa"
optional = true
description = "the minimum miscibility pressure; absent where the range never reaches the threshold.\n"
[outputs.mechanism]
type = "string"
description = "one of first_contact, vaporizing, condensing, combined, immiscible, unknown.\n"
[outputs.points]
type = "record_list"
description = "the slim tube's recovery curve; empty for the key tie line.\n"
[outputs.points.fields.pressure]
unit = "Pa"
description = "the grid pressure.\n"
[outputs.points.fields.recovery]
unit = "dimensionless"
description = "the recovery at that pressure, 0 to 1.\n"
[implementations]
python = "azoth.pvt.mmp"
rust = "azoth_pvt::mmp"
