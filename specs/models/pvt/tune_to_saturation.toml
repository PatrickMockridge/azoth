id = "pvt.tune_to_saturation"
name = "Plus-molar-mass saturation tuning"
kind = "procedure"
assumptions = [
    "**the loop steps the plus fraction's molar mass by `dp/1000`**, with `dp` in bar, flipping the sign when the error grows; 50 iterations at most, a `1e-3` bar tolerance, and an early return under `0.01` bar.\n",
    "**the exit criterion lags one run behind**: the class reads the error at the top of each pass, so the final saturation pressure can sit above `1e-3` bar from the target. `converged` says whether the loop exited on that criterion rather than the cap.\n",
    "**each iteration re-characterises the plus end**: the split and its seven lumps, each lump's critical constants from the TBP correlations, and the saturation scan on the rebuilt fluid. The initial `P = target - 50 bar` is unobservable, because the scan overwrites every trial pressure.\n",
    "**the plus row must be the fluid's only pseudo row.** The class's `characterisePlusFraction` lumps every TBP and plus row together; `characterization.characterise_plus_fraction` is the plus end alone, so a mixed fluid is refused rather than answered with a different characterisation.\n",
    "**the class's `tunePlusMolarMass` and `tuneVolumeCorrection` flags are never read**, and its `saturationPressure` default of `273.15` is a temperature literal in a pressure field; neither is reachable through this surface.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `pvtsimulation/modeltuning/TuneToSaturation.java` and `simulation/SaturationPressure.java` are the port source.",
    "`validation/neqsim/captures/pvt_tune_to_saturation.tsv` - the early-return and seventeen-step blocks on a methane/n-decane/C11 plus fluid at 350 K.",
]
[source]
standard = "NeqSim pvtsimulation/modeltuning/TuneToSaturation.java"
edition = "Its `run` loop over `SaturationPressure.calcSaturationPressure`, with the plus molar mass as the tuned variable."
[algorithm]
scheme = "plus_molar_mass_search"
convergence = "absolute"
tolerance = 100.0
max_iterations = 50
initialisation = "stated_plus_row_and_model"
[inputs]
[inputs.components]
type = "record_list"
row_type = "FluidComponent"
description = "The fluid's components, one record each, in the mixture's order. Every row states the same fluid index: one id describes one fluid.\n"
[inputs.components.fields.fluid]
unit = "dimensionless"
description = "Which fluid the row belongs to, 0-based. Fluids are ordered by first appearance, and a whole number from zero is required: a fractional or negative index is not a fluid.\n"
[inputs.components.fields.name]
type = "string"
description = "The component's name. A base component merges by it across the fluids; a pseudo-component's is its own fluid's name and does not survive into the answer.\n"
[inputs.components.fields.pseudo_component]
type = "boolean"
description = "Whether the row is a TBP or plus fraction rather than a base component. A base row's properties are absent and are the databank's at assembly.\n"
[inputs.components.fields.moles]
unit = "mol"
description = "The component's mole amount. Only a positive one is read; a zero or negative amount is a row that is not on the grid.\n"
[inputs.components.fields.molar_mass]
unit = "kg/mol"
optional = true
description = "The pseudo-component's molar mass, which is what the row's mass is and what its sorting key falls back to. Required on a pseudo row and ignored on a base row.\n"
[inputs.components.fields.density]
unit = "kg/m**3"
optional = true
description = "The pseudo-component's normal liquid density, which a group's volume is the mass over. Required on a pseudo row and ignored on a base row.\n"
[inputs.components.fields.normal_boiling_point]
unit = "K"
optional = true
description = "The pseudo-component's normal boiling point, its sorting key where it states a finite positive one. A row without one sorts by its molar mass.\n"
[inputs.components.fields.critical_temperature]
unit = "K"
optional = true
description = "The pseudo-component's critical temperature, part of the blend's mole-fraction-weighted override.\n"
[inputs.components.fields.critical_pressure]
unit = "Pa"
optional = true
description = "The pseudo-component's critical pressure, part of the blend's mole-fraction-weighted override.\n"
[inputs.components.fields.acentric_factor]
unit = "dimensionless"
optional = true
description = "The pseudo-component's acentric factor, part of the blend's mole-fraction-weighted override.\n"
[inputs.components.fields.critical_volume]
unit = "m**3/mol"
optional = true
description = "The pseudo-component's critical molar volume, mass-weighted into the group's.\n"
[inputs.components.fields.racket_z]
unit = "dimensionless"
optional = true
description = "The pseudo-component's Rackett compressibility, mass-weighted into the group's and read again when the row becomes a component.\n"
[inputs.components.fields.racket_z_cpa]
unit = "dimensionless"
optional = true
description = "The same compressibility on the CPA basis, mass-weighted into the group's.\n"
[inputs.components.fields.parachor]
unit = "dimensionless"
optional = true
description = "The pseudo-component's parachor, in NeqSim's mixed `(mN/m)**(1/4) * cm**3/mol`, mass-weighted into the group's.\n"
[inputs.components.fields.critical_viscosity]
unit = "Pa*s"
optional = true
description = "The pseudo-component's critical viscosity, mass-weighted into the group's.\n"
[inputs.components.fields.triple_point_temperature]
unit = "K"
optional = true
description = "The pseudo-component's triple-point temperature, mass-weighted into the group's.\n"
[inputs.components.fields.heat_of_fusion]
unit = "J/mol"
optional = true
description = "The pseudo-component's heat of fusion, mass-weighted into the group's.\n"
[inputs.components.fields.ideal_gas_enthalpy_of_formation]
unit = "J/mol"
optional = true
description = "The pseudo-component's ideal-gas enthalpy of formation, mass-weighted into the group's. It has no home on a `Component` and is dropped when a mixture is assembled.\n"
[inputs.components.fields.cp_a]
unit = "J/(mol*K)"
optional = true
description = "The constant term of the pseudo-component's ideal-gas heat capacity, mass-weighted into the group's.\n"
[inputs.components.fields.cp_b]
unit = "J/(mol*K**2)"
optional = true
description = "The coefficient of `T` in the pseudo-component's ideal-gas heat capacity.\n"
[inputs.components.fields.cp_c]
unit = "J/(mol*K**3)"
optional = true
description = "The coefficient of `T**2` in the pseudo-component's ideal-gas heat capacity.\n"
[inputs.components.fields.cp_d]
unit = "J/(mol*K**4)"
optional = true
description = "The coefficient of `T**3` in the pseudo-component's ideal-gas heat capacity, as `getCpD()` states it: the stored coefficient plus `1e-10`.\n"
[inputs.components.fields.attractive_m]
unit = "dimensionless"
optional = true
description = "The fitted coefficient of the pseudo-component's Soave alpha function, which NeqSim's `addTBPfraction` installs in place of the acentric factor's correlation.\n"

[inputs.plus_component]
type = "string"
description = "The name of the fluid's plus row, which must be a pseudo row and the only one.\n"
[inputs.saturation_temperature]
unit = "K"
description = "The temperature the saturation boundary is searched at.\n"
[inputs.saturation_pressure]
unit = "Pa"
description = "The saturation pressure the plus molar mass is tuned to.\n"
[inputs.plus_model]
type = "enum"
values = ["pedersen", "pedersen_heavy_oil", "whitson_gamma"]
optional = true
description = "The plus split the class re-characterises with. **Absent is `pedersen`**, the model `getModel(\"\")` returns.\n"
[inputs.number_of_lumps]
unit = "dimensionless"
optional = true
description = "How many pseudo-components each characterisation makes. **Absent is 7**, `LumpingModel.numberOfPseudocomponents`'s own.\n"
[inputs.eos]
type = "enum"
values = ["srk", "pr"]
optional = true
description = "The cubic the rows are assembled for. **Absent is `srk`**, the class's fluid.\n"
[inputs.mixing_rule]
type = "enum"
values = ["classic", "zero"]
optional = true
description = "Where the base components' interaction coefficients come from. **Absent is `classic`**.\n"
[inputs.volume_correction]
type = "boolean"
optional = true
description = "Whether the Peneloux translation is applied. **Absent is true**.\n"
[inputs.max_iterations]
unit = "dimensionless"
optional = true
description = "The loop's iteration cap. **Absent is 50**, the class's own.\n"
[outputs]
[outputs.tuned_molar_mass]
unit = "kg/mol"
description = "The plus fraction's molar mass after the last update, which is the one the last run used.\n"
[outputs.final_saturation_pressure]
unit = "Pa"
description = "The saturation pressure of the last run.\n"
[outputs.iterations]
unit = "dimensionless"
description = "The steps taken; zero is the class's early return.\n"
[outputs.converged]
type = "boolean"
description = "Whether the loop exited on its own tolerance rather than the iteration cap.\n"
[[valid_range]]
quantity = "number_of_lumps"
min = 1
min_inclusive = true
severity = "error"
rationale = "a characterisation needs at least one lump\n"
[[valid_range]]
quantity = "max_iterations"
min = 1
min_inclusive = true
severity = "error"
rationale = "the loop needs at least one step budget\n"
[implementations]
python = "azoth.pvt.tune_to_saturation"
rust = "azoth_pvt::tune_to_saturation"
