[inputs.eos]
type = "enum"
values = ["srk", "pr"]
optional = true
description = "the cubic; absent is srk.\n"
[inputs.mixing_rule]
type = "enum"
values = ["classic", "zero"]
optional = true
description = "the interaction matrix; absent is classic, and the upstream case sets zero.\n"
[inputs.temperature]
unit = "K"
optional = true
description = "the experiment temperature; absent is the class's 298.15 K.\n"
[inputs.cumulative_gas_injected]
type = "vector"
unit = "dimensionless"
description = "the cumulative gas injected, as fractions of the original oil moles, non-decreasing.\n"
[inputs.volume_correction]
type = "boolean"
optional = true
description = "whether the Peneloux translation is applied; absent is true, and the upstream case sets false.\n"
[outputs]
[outputs.original_oil_moles]
unit = "mol"
description = "the base oil's total amount.\n"
[outputs.original_oil_volume]
unit = "m**3"
description = "the base oil's bubble-point volume.\n"
[outputs.points]
type = "record_list"
description = "one row per schedule entry.\n"
[outputs.points.fields.cumulative_gas_injected]
unit = "dimensionless"
description = "the cumulative injection, as a fraction of the original oil moles.\n"
[outputs.points.fields.pressure]
unit = "Pa"
description = "the bubble-point pressure.\n"
[outputs.points.fields.relative_oil_volume]
unit = "dimensionless"
description = "the bubble-point volume over the base oil's.\n"
