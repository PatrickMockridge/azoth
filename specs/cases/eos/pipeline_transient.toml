model = "eos.pipeline_transient"
[[cases]]
id = "a_five_cell_methane_butane_line"
tolerance = 1e-06
source = "A 1 km, 0.1 m methane/butane line starting uniform at 300 K and 50 bara, closed at the inlet and held at 40 bara at the outlet. The initial conserved state is that state's `eos.state_at_tp` volume, composition and internal energy; the expected values are recorded from the reference kernel and held to the Rust kernel by the cross-implementation test."
