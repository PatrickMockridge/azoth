model = "eos.state_at_tp"
[[cases]]
id = "methane_and_butane_at_330_k_and_25_bar"
tolerance = 1e-09
source = "This model's own output, recorded: the split is the state `eos.pt_flash_check` pins, and the properties are `eos.molar_enthalpy_entropy`'s and the phase capacity's at that split."
[cases.inputs]
components = ["methane", "n-butane"]
T = 330.0
P = 2500000.0
z = [0.6, 0.4]
