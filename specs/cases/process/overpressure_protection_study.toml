[cases.inputs]
mawp = 800000.0
relief_set_pressure = 1000000.0
scenarios = [
    { name = "Blocked outlet gas", cause = "blocked_outlet", phase = "vapour", relief_rate = 2.0, relief_temperature = 320.0, molar_mass = 0.017445699999999998, compressibility = 0.9591602013460842, specific_heat_ratio = 1.2795798973843786 },
]
