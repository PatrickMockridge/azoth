[[cases]]
id = "study_no_credible"
tolerance = 1.0e-7
source = "One non-credible fire case: nothing governs and nothing is sized. From (`study_no_credible`)."
[cases.inputs]
mawp = 2000000.0
scenarios = [
    { name = "Not credible", cause = "fire", phase = "vapour", relief_rate = 100.0, relief_temperature = 350.0, molar_mass = 0.02, compressibility = 0.9, specific_heat_ratio = 1.3, credible = false },
]
[cases.expected]
capacity_adequate = false
messages = ["No credible positive relief demand defined"]

[[cases]]
id = "study_zero_rate"
tolerance = 1.0e-7
source = "A zero-rate case is not a credible positive demand, so nothing governs and the study is unsized. From (`study_zero_rate`)."
[cases.inputs]
mawp = 2000000.0
scenarios = [
    { name = "Zero rate", cause = "blocked_outlet", phase = "vapour", relief_rate = 0.0, relief_temperature = 320.0, molar_mass = 0.02, compressibility = 0.9, specific_heat_ratio = 1.3 },
]
[cases.expected]
capacity_adequate = false
messages = ["Zero rate: Missing or invalid pressure, relief demand, cause or relieving-phase property basis", "Resolve all credible relief demands before selecting an orifice"]

[[cases]]
id = "study_capacity_shortfall"
tolerance = 1.0e-7
source = "A 1000 kg/s gas case: the largest orifice is still short. From (`study_capacity_shortfall`)."
[cases.inputs]
mawp = 2000000.0
scenarios = [
    { name = "Capacity shortfall", cause = "blocked_outlet", phase = "vapour", relief_rate = 1000.0, relief_temperature = 320.0, molar_mass = 0.02, compressibility = 0.9, specific_heat_ratio = 1.3 },
]
[cases.expected]
governing_name = "Capacity shortfall"
governing_cause = "blocked_outlet"
governing_phase = "vapour"
governing_relief_rate = 1000.0
required_area = 0.2426153907602733
required_area_in2 = 376.0546077876392
recommended_orifice = "T"
selected_area_in2 = 26.0
selected_orifice_capacity = 69.13889488805943
capacity_adequate = false
acceptance_peak_pressure = 2189867.5
acceptance_allowable_pressure = 2189867.5
acceptance_accumulation_factor = 1.1
acceptance_margin = 0.0
accepted = true
messages = ["Capacity shortfall: A single standard orifice cannot be selected for this relief demand"]

