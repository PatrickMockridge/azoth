model = "process.overpressure_protection_study"

[[cases]]
id = "study_gas"
tolerance = 1.0e-7
source = "A 20 bara MAWP item with a 0.5 kg/s and a 2.0 kg/s blocked-outlet gas case: the larger governs and the J orifice is selected. From `validation/neqsim/captures/process_overpressure_protection_study.tsv` (`study_gas`)."
[cases.inputs]
mawp = 2000000.0
scenarios = [
    { name = "Blocked outlet small", cause = "blocked_outlet", phase = "vapour", relief_rate = 0.5, relief_temperature = 320.0, molar_mass = 0.017445699999999998, compressibility = 0.9591602013460842, specific_heat_ratio = 1.2795798973843786 },
    { name = "Blocked outlet gas", cause = "blocked_outlet", phase = "vapour", relief_rate = 2.0, relief_temperature = 320.0, molar_mass = 0.017445699999999998, compressibility = 0.9591602013460842, specific_heat_ratio = 1.2795798973843786 },
]
[cases.expected]
governing_name = "Blocked outlet gas"
governing_cause = "blocked_outlet"
governing_phase = "vapour"
governing_relief_rate = 2.0
required_area = 5.36864508122035e-4
required_area_in2 = 0.832141651872458
recommended_orifice = "J"
selected_area_in2 = 1.287
selected_orifice_capacity = 3.093223364325135
capacity_adequate = true
acceptance_peak_pressure = 2200000.0
acceptance_allowable_pressure = 2200000.0
acceptance_accumulation_factor = 1.1
acceptance_margin = 0.0
accepted = true

