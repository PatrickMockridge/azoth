model = "process.risk_matrix"
[[cases]]
id = "rm_bands"
tolerance = 1.0e-12
source = "`RiskMatrixTest`: the five probability and consequence bands, one row each, at the class's default price and downtime cost. From `validation/neqsim/captures/process_risk_matrix.tsv` (`rm_bands`)."
[cases.inputs]
equipment = [
  { name = "EQ0", failures_per_year = 0.05, mttr_hours = 48.0, production_loss_percent = 3.0, production_loss_kg_per_hr = 1000.0 },
  { name = "EQ1", failures_per_year = 0.3, mttr_hours = 48.0, production_loss_percent = 15.0, production_loss_kg_per_hr = 1000.0 },
  { name = "EQ2", failures_per_year = 0.7, mttr_hours = 48.0, production_loss_percent = 35.0, production_loss_kg_per_hr = 1000.0 },
  { name = "EQ3", failures_per_year = 1.5, mttr_hours = 48.0, production_loss_percent = 65.0, production_loss_kg_per_hr = 1000.0 },
  { name = "EQ4", failures_per_year = 3.0, mttr_hours = 48.0, production_loss_percent = 90.0, production_loss_kg_per_hr = 1000.0 },
]
product_price_per_kg = 0.5
downtime_cost_per_hour = 5000.0
[cases.expected]
assessments = [
