model = "process.active_fire_protection_screening"
[[cases]]
id = "a_gas_jet_fire_is_not_extinguishable_but_blowdown_wins"
tolerance = 1.0e-12
source = "`FireWaterDesignTest.waterDoesNotExtinguishAGasJetFireButIsCreditableForEscalationControl`, the gas-jet half, with the class's 600 s blowdown against 900 s steel. From `validation/neqsim/captures/process_active_fire_protection_screening.tsv` (`afps_gas_jet`)."
[cases.inputs]
scenario = "gas_jet_fire"
blowdown_time_to_target = 600.0
bare_steel_time_to_critical = 900.0
dedicated_object_demand = 170.0
general_area_demand = 5100.0
[cases.expected]
water_extinguishing = false
blowdown_faster_than_failure = true
blowdown_margin = 300.0
selective_protection_saving_fraction = 0.9666666666666667
