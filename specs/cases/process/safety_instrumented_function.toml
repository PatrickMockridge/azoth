model = "process.safety_instrumented_function"
[[cases]]
id = "sif_class_test"
tolerance = 1.0e-12
source = "`SISIntegrationTest`: SIL 2 at PFD 0.005, a one-year proof interval, 1e-6 /h failure rate and a 0.99 base availability. From `validation/neqsim/captures/process_safety_instrumented_function.tsv` (`sif_class_test`)."
[cases.inputs]
pfd_average = 0.005
claimed_sil = 2.0
unmitigated_frequency_per_year = 0.1
target_frequency_per_year = 1.0e-5
test_interval_hours = 8760.0
lambda_du_per_hour = 1.0e-6
spurious_trip_rate_per_year = 0.0
mttr_hours = 0.0
base_availability = 0.99
[cases.expected]
risk_reduction_factor = 200.0
mitigated_frequency_per_year = 5.0e-4
required_pfd = 1.0e-4
required_sil = 3.0
max_pfd_for_claimed_sil = 0.01
proof_test_interval_years = 1.0
pfd_within_claimed_sil = true
pfd_1oo1 = 0.00438
pfd_1oo2 = 2.5579200000000004e-5
pfd_2oo3 = 7.673760000000001e-5
availability_with_spurious_trips = 0.99
[[cases]]
id = "sif_required_pfd_at_zero"
tolerance = 1.0e-12
source = "An unmitigated frequency of zero: the class answers a required PFD of 1.0 and SIL 1. From (`sif_required_pfd_at_zero`)."
