model = "process.piping_fiv_liquid"
[[cases]]
id = "liquid_low"
tolerance = 1.0e-12
source = "A 1 m/s liquid in a 20 D/t line: the velocity term is 1/6 and the score is low. From `validation/neqsim/captures/process_piping_fiv_liquid.tsv` (`fiv_liquid_low`)."
[cases.inputs]
velocity = 1.0
outside_diameter = 0.2
wall_thickness = 0.01
branch_count = 0
support_quality_factor = 1.0
[cases.expected]
lof = 0.16666666666666666
likelihood = "low"
d_overt = 20.0
d_overt_factor = 1.0
branch_factor = 1.0
support_quality_factor_applied = 1.0
energy_term = 0.16666666666666666
[[cases]]
id = "liquid_boundary_030"
tolerance = 1.0e-12
source = "A 1.8 m/s liquid scores exactly 0.3, the medium band's lower boundary. From (`fiv_liquid_boundary_030`)."
[cases.inputs]
velocity = 1.8
outside_diameter = 0.2
wall_thickness = 0.01
branch_count = 0
support_quality_factor = 1.0
[cases.expected]
lof = 0.3
likelihood = "medium"
d_overt = 20.0
d_overt_factor = 1.0
branch_factor = 1.0
support_quality_factor_applied = 1.0
energy_term = 0.3
