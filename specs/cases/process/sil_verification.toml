model = "process.sil_verification"
[[cases]]
id = "sv_canonical"
tolerance = 1.0e-12
source = "`SILRunnerTest.calculatesCanonicalScreeningCase`: claimed SIL 2 at PFD 0.005, 1oo1, one-year proof interval. From `validation/neqsim/captures/process_sil_verification.tsv` (`sv_canonical`)."
[cases.inputs]
pfd_average = 0.005
claimed_sil = 2.0
architecture = "1oo1"
test_interval_hours = 8760.0
[cases.expected]
claimed_sil = 2.0
achieved_sil = 2.0
sil_achieved = true
pfd_average = 0.005
pfd_upper = 0.0075
hardware_fault_tolerance = 0.0
systematic_capability = 2.0
diagnostic_coverage = 0.5
issue_count = 0.0
error_count = 0.0
warning_count = 0.0
verification_passed = true
