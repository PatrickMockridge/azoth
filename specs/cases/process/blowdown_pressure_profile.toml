[[cases]]
id = "near_equal_upper_step"
tolerance = 1.0e-9
source = "The absolute 1e-10 window snaps to 80 bara at 5 s minus 5e-11. From (`blowdown_step_near_equal_upper`)."
[cases.inputs]
time = 4.99999999995
interpolation_mode = "step_previous"
gauge_offset = 1.0
points = [
  { time = 0.0, pressure = 87.0 },
  { time = 5.0, pressure = 80.0 },
  { time = 10.0, pressure = 74.0 },
]
[cases.expected]
pressure_absolute = 80.0
pressure_gauge = 79.0

[[cases]]
