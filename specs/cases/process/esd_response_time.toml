model = "process.esd_response_time"
[[cases]]
id = "within_budget"
tolerance = 1.0e-12
source = "The class's `testResponseTimeWithinBudget`: a 1.0 s detection, a 0.5 s logic contribution and a 0.5 + 8.0 s valve against a 15 s budget. From `validation/neqsim/captures/process_esd_response_time.tsv` (`esd_within_budget`)."
[cases.inputs]
sif_tag = "ESD-1234"
contributions = [
  { name = "PT-1001 high-pressure", stage = "detection", time = 1.0 },
  { name = "Logic solver scan + 2oo3 vote", stage = "logic", time = 0.5 },
  { name = "ESDV-2001", stage = "final_element", time = 8.5 },
]
allowable_response_time = 15.0
[cases.expected]
sif_tag = "ESD-1234"
detection_time = 1.0
logic_time = 0.5
final_element_time = 8.5
total_response_time = 10.0
allowable_response_time = 15.0
margin = 5.0
contributions = [
  { name = "PT-1001 high-pressure", stage = "detection", time = 1.0 },
  { name = "Logic solver scan + 2oo3 vote", stage = "logic", time = 0.5 },
  { name = "ESDV-2001", stage = "final_element", time = 8.5 },
]
[[cases]]
id = "exceeds_budget"
tolerance = 1.0e-12
source = "The class's `testResponseTimeExceedsBudget`: a 21.0 s valve pushes the total to 23.5 s against the same budget. From (`esd_exceeds_budget`)."
[cases.inputs]
sif_tag = "ESD-9999"
contributions = [
  { name = "LT-3001 high-level", stage = "detection", time = 2.0 },
  { name = "Logic solver", stage = "logic", time = 0.5 },
  { name = "ESDV-3002 (large bore)", stage = "final_element", time = 21.0 },
]
allowable_response_time = 15.0
[cases.expected]
total_response_time = 23.5
allowable_response_time = 15.0
margin = -8.5
[[cases]]
id = "no_budget"
tolerance = 1.0e-12
source = "The class with no allowable time: the total is 1.0 s, within budget, with no margin. From (`esd_no_budget`)."
[cases.inputs]
sif_tag = "ESD-NOBUDGET"
contributions = [
  { name = "TT-1", stage = "detection", time = 1.0 },
]
[cases.expected]
total_response_time = 1.0
[[cases]]
id = "zero_time_and_equal_budget"
tolerance = 1.0e-12
source = "A zero-time detection and a 2.0 s logic contribution against a 2.0 s budget: equality passes. From (`esd_zero_time`)."
[cases.inputs]
sif_tag = "ESD-ZERO"
contributions = [
  { name = "DT-1", stage = "detection", time = 0.0 },
  { name = "logic", stage = "logic", time = 2.0 },
]
allowable_response_time = 2.0
[cases.expected]
detection_time = 0.0
logic_time = 2.0
final_element_time = 0.0
total_response_time = 2.0
allowable_response_time = 2.0
margin = 0.0
