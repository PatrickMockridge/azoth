model = "process.deluge_nozzle_layout"
[[cases]]
id = "high_velocity_nozzles_are_coverage_governed"
tolerance = 1.0e-12
source = "`FireWaterDesignTest.nozzleCountIsGovernedByTheLargerOfFlowAndCoverage`: 510 m2 at 10 L/(min m2) on high-velocity nozzles at 5 bar. From `validation/neqsim/captures/process_deluge_nozzle_layout.tsv` (`dnl_high_velocity`)."
[cases.inputs]
protected_area = 510.0
required_density = 10.0
nozzle_k = 42.9
nozzle_min_pressure = 3.5
nozzle_max_spacing = 3.0
nozzle_clearance = 1.0
available_clearance = 1.2
operating_pressure = 5.0
coverage_efficiency = 1.0
[cases.expected]
required_flow = 5100.0
flow_per_nozzle = 95.92731623474099
coverage_per_nozzle = 9.0
nozzle_count_from_flow = 54.0
nozzle_count_from_coverage = 57.0
nozzle_count = 57.0
governing_criterion = "coverage"
grid_spacing = 2.991215208080594
delivered_flow = 5467.857025380236
delivered_density = 10.721288285059288
pressure_adequate = true
density_met = true
clearance_adequate = true
