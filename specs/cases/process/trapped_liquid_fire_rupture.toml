model = "process.trapped_liquid_fire_rupture"
[[cases]]
id = "no_failure"
tolerance = 1.0e-9
source = "A 50 bar, 300 K, 10 m3 two-phase inventory on a 0.1 m, 10 m pipe at a 10 kW/m2 fixed flux for 20 s with the vapor-pocket test off: no event. From `validation/neqsim/captures/process_trapped_liquid_fire_rupture.tsv` (`tlf_no_failure`)."
[cases.inputs]
components = ["methane", "ethane", "n-butane"]
z = [0.5, 0.3, 0.2]
inventory_pressure = 5000000.0
inventory_temperature = 300.0
inventory_liquid_mass = 2246.059130169441
inventory_total_mass = 2556.756576013232
inventory_total_volume = 10.0
pipe_internal_diameter = 0.1
wall_thickness = 0.01
exposed_length = 10.0
fire_type = "fixed_heat_flux"
fire_heat_flux = 10000.0
max_time = 20.0
time_step = 2.0
vapor_pocket_detection = false
[cases.expected]
segment_id = "trapped-segment"
limiting_failure_mode = "none"
final_pressure = 5012760.306260937
final_liquid_temperature = 300.01519084078683
final_outer_wall_temperature = 305.30679875134905
[[cases]]
id = "flange_failure"
tolerance = 1.0e-9
source = "A 10 bar inventory on a 0.1 m, 10 m pipe, class 150 flange and a 500 kW/m2 fixed flux: the flange fails at 22 s. From (`tlf_flange`)."
[cases.inputs]
components = ["methane", "ethane", "n-butane"]
z = [0.5, 0.3, 0.2]
inventory_pressure = 1000000.0
inventory_temperature = 300.0
inventory_liquid_mass = 4000.0
inventory_total_mass = 4061.735103001965
inventory_total_volume = 10.0
pipe_internal_diameter = 0.1
wall_thickness = 0.01
exposed_length = 10.0
fire_type = "fixed_heat_flux"
fire_heat_flux = 500000.0
flange_class = "150"
max_time = 600.0
time_step = 2.0
[cases.expected]
limiting_failure_mode = "flange_failure"
time_to_flange_failure = 22.0
minimum_failure_time = 22.0
final_pressure = 1465832.210042704
final_liquid_temperature = 300.55456215481274
final_outer_wall_temperature = 586.9348854255791
