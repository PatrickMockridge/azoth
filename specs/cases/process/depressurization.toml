model = "process.depressurization"
[[cases]]
id = "cold_gas_60s"
tolerance = 1.0e-2
source = "`dep_cold_gas_60s`: a methane/ethane/propane/butane gas at 313.15 K and 90 bara in a 30 m3 vessel through a 0.03 m opening at Cd 0.85 into 2 bara, for 60 one-second steps. The gas cools to `286.33921312600967` K. **Tolerance**: the VU flash is the divergence.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "n-butane"]
initial_z = [0.85, 0.08, 0.04, 0.03]
initial_t = 313.15
initial_p = 9000000.0
vessel_volume = 30.0
orifice_diameter = 0.03
discharge_coefficient = 0.85
back_pressure = 200000.0
time_step = 1.0
max_time = 60.0
[cases.expected]
initial_pressure = 9000000.0
fire_heat_input = 0.0
fire_heat_routed_to_wall = false
vu_flash_fallback_count = 0.0
vapour_withdrawal_used = false
min_fluid_temperature = 286.33921312600967
min_wall_temperature = 313.15
max_pressure = 9000000.0
max_fluid_temperature = 313.15
max_wall_temperature = 313.15
half_pressure_criterion_met = false
seven_barg_criterion_met = false
pressure_monotonic_non_increasing = true
mass_monotonic_non_increasing = true
recorded_points = 61.0
