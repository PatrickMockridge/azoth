model = "process.depressurization_acceptance"
[[cases]]
id = "pass_with_rupture_limit"
tolerance = 1.0e-12
source = "`acc_pass_rupture_limits`: the three-sample trajectory (50 bara at 0 s, 10 bara and 40 kg at 100 s, 5 bara and 20 kg at 200 s) with a 120 s escape time, a 100 s rupture time and limits of 15 bara, 50 kg and 6 kg/s. The limiting time is the rupture's 100 s.\n"
[cases.inputs]
points = [
  { time = 0.0, pressure = 5000000.0, mass = 100.0, mass_flow = 0.0 },
  { time = 100.0, pressure = 1000000.0, mass = 40.0, mass_flow = 5.0 },
  { time = 200.0, pressure = 500000.0, mass = 20.0, mass_flow = 2.0 },
]
time_to_escape = 120.0
estimated_time_to_rupture = 100.0
maximum_pressure_at_rupture = 1500000.0
maximum_remaining_mass = 50.0
maximum_escalated_fire_rate = 6.0
[cases.expected]
limiting_time = 100.0
pressure_at_limiting_time = 1000000.0
remaining_mass_at_limiting_time = 40.0
peak_discharge_rate = 5.0
pressure_configured = true
pressure_criterion_met = true
mass_configured = true
mass_criterion_met = true
fire_rate_configured = true
fire_rate_criterion_met = true
acceptable = true
[[cases]]
id = "fail_pressure"
tolerance = 1.0e-12
source = "`acc_fail_pressure`: the same trajectory with a 9 bara pressure limit, which the 10 bara state at the limiting time exceeds.\n"
[cases.inputs]
points = [
  { time = 0.0, pressure = 5000000.0, mass = 100.0, mass_flow = 0.0 },
  { time = 100.0, pressure = 1000000.0, mass = 40.0, mass_flow = 5.0 },
  { time = 200.0, pressure = 500000.0, mass = 20.0, mass_flow = 2.0 },
]
time_to_escape = 120.0
estimated_time_to_rupture = 100.0
maximum_pressure_at_rupture = 900000.0
maximum_remaining_mass = 50.0
maximum_escalated_fire_rate = 6.0
[cases.expected]
limiting_time = 100.0
pressure_at_limiting_time = 1000000.0
remaining_mass_at_limiting_time = 40.0
peak_discharge_rate = 5.0
pressure_configured = true
pressure_criterion_met = false
mass_configured = true
mass_criterion_met = true
fire_rate_configured = true
fire_rate_criterion_met = true
acceptable = false
[[cases]]
id = "fail_mass"
tolerance = 1.0e-12
source = "`acc_fail_mass`: the same trajectory with a 30 kg mass limit, which the 40 kg state at the limiting time exceeds.\n"
