model = "process.api537_flare_flame_model"
[[cases]]
id = "the_flame_length_and_sterile_zones"
tolerance = 1.0e-12
source = "`Api537FlareFlameModelTest.testFlameLength` and `testSterileZoneOrdering`: 50 kg/s of 50 MJ/kg gas at a 200 m/s exit, a 40 m stack, targets at the class's four flux constants. From `validation/neqsim/captures/process_api537_flare_flame.tsv` (`api537_flame_length`)."
[cases.inputs]
mass_flow = 50.0
heat_of_combustion = 5.0e7
radiative_fraction = 0.2
exit_velocity = 200.0
ground_distance = 60.0
sound_distance = 100.0
stack_height = 40.0
wind_speed = 0.0
transmissivity = 1.0
acoustic_efficiency = 3.0e-6
target_fluxes = [
    { flux = 1580.0 },
    { flux = 4730.0 },
    { flux = 6300.0 },
    { flux = 9460.0 },
]
[cases.expected]
heat_release = 2.5e9
radiative_power = 5.0e8
flame_length = 101.25883447888855
flame_tilt = 0.0
flame_center_horizontal = 0.0
flame_center_height = 90.62941723944428
flame_tip_horizontal = 0.0
flame_tip_height = 141.25883447888856
heat_flux_at_ground_distance = 3368.0189253666404
sterile_radii = [
    { flux = 1580.0, radius = 130.26531729876814 },
    { flux = 4730.0, radius = 14.082031417585814 },
    { flux = 6300.0, radius = 0.0 },
    { flux = 9460.0, radius = 0.0 },
]
sound_power_level = 158.750612633917
sound_pressure_level = 107.750612633917
equivalent_flame_temperature = 1228.9672934218445
