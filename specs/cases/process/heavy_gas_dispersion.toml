tolerance = 1.0e-12
source = "The identical-input state behind `process_gas_dispersion.tsv`'s `pr_methane_forced_heavy`: 1 kg/s of methane at the analyzer's source density over 5 m/s, at the LFL ratio. From `validation/neqsim/captures/process_heavy_gas_dispersion.tsv` (`methane_forced_heavy_lfl`)."
[cases.inputs]
volumetric_rate = 1.4704613275596858
source_density = 0.6800586872009459
air_density = 1.2250122659906946
wind_speed = 5.0
concentration_ratio = 0.044
[cases.expected]
reduced_gravity = -4.364033533659363
britter_parameter = 0.3894717381427939
distance_to_concentration_ratio = 9.76535507728693

