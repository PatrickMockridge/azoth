  { check = "credible_scenarios", status = "pass" },
  { check = "governing_case", status = "pass" },
  { check = "capacity", status = "needs_review" },
  { check = "acceptance", status = "pass" },
  { check = "fire_basis", status = "pass" },
  { check = "dynamic_determination", status = "needs_review" },
]
pass_count = 4.0
review_count = 2.0
fail_count = 0.0
compliant = true

