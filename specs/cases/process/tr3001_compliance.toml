model = "process.tr3001_compliance"

[[cases]]
id = "tr_all_pass"
tolerance = 1.0e-12
source = "Two credible scenarios with a fire governing, sized and accepted at 21 %: all six checks pass. From `validation/neqsim/captures/process_tr3001_compliance.tsv` (`tr_all_pass`)."
[cases.inputs]
scenarios = [
  { cause = "fire", relief_rate = 1.0, dynamically_determined = true, credible = true },
  { cause = "blocked_outlet", relief_rate = 0.5, dynamically_determined = true, credible = true },
]
capacity_adequate = true
required_area_in2 = 0.5
acceptance_accepted = true
accumulation_fraction = 0.21
[cases.expected]
findings = [
  { check = "credible_scenarios", status = "pass" },
  { check = "governing_case", status = "pass" },
  { check = "capacity", status = "pass" },
  { check = "acceptance", status = "pass" },
  { check = "fire_basis", status = "pass" },
  { check = "dynamic_determination", status = "pass" },
]
pass_count = 6.0
review_count = 0.0
fail_count = 0.0
compliant = true

[[cases]]
id = "tr_no_credible"
tolerance = 1.0e-12
source = "No credible scenario: the credible and governing checks fail, and the capacity check is skipped. From (`tr_no_credible`)."
[cases.inputs]
scenarios = [
  { cause = "fire", relief_rate = 1.0, dynamically_determined = true, credible = false },
  { cause = "blocked_outlet", relief_rate = 0.5, dynamically_determined = true, credible = false },
]
capacity_adequate = true
required_area_in2 = 0.5
acceptance_accepted = true
accumulation_fraction = 0.21
[cases.expected]
findings = [
  { check = "credible_scenarios", status = "fail" },
  { check = "governing_case", status = "fail" },
  { check = "acceptance", status = "pass" },
]
pass_count = 1.0
review_count = 0.0
fail_count = 2.0
compliant = false

[[cases]]
id = "tr_unsized"
