model = "process.semenov_self_heating"

[[cases]]
id = "semenov_base"
tolerance = 1.0e-9
source = "The class test's V = 0.01 m3, S = 0.3 m2, h = 10 W/(m2 K), E = 110 kJ/mol and P = 5e13 W/m3 at 400 K. From `validation/neqsim/captures/process_semenov_self_heating.tsv` (`semenov_base`)."
[cases.inputs]
volume = 0.01
surface_area = 0.3
heat_transfer_coefficient = 10.0
activation_energy = 110000.0
volumetric_pre_factor = 5.0e13
ambient_temperature = 400.0
[cases.expected]
psi = 5.9571938659084104e-5
psi_crit = 0.36787944117144233
psi_ratio = 1.6193331834306522e-4
critical_temperature = 558.7418280541897
temperature_margin = 158.74182805418968
critical_temperature_rise = 12.093763808
verdict = "subcritical"
messages = [
    "Semenov theory assumes a spatially uniform body temperature (small Biot number); use PorousMediaSelfHeatingAnalyzer when internal conduction controls",
]

[[cases]]
id = "semenov_at_critical"
tolerance = 1.0e-9
source = "The reported critical temperature itself: `psi_ratio` is one to the bisection's residue, so the class screens its own critical state as a self-ignition. From (`semenov_at_critical`)."
[cases.inputs]
volume = 0.01
surface_area = 0.3
heat_transfer_coefficient = 10.0
activation_energy = 110000.0
volumetric_pre_factor = 5.0e13
ambient_temperature = 558.7418280541897
