model = "process.dynamic_psv_sizing"
[[cases]]
id = "fifty_bara_gas"
tolerance = 1.0e-6
source = "`dpsv_50bara`: a methane/ethane/propane gas at 350 K and 50 bara, a 5 m3 vessel, 0.5 MW of fire, a 50 bara set pressure at 21 % accumulation and a 1 bara back pressure. The steady area is `1.3532429190157695e-4` m2 and the dynamic `5.44015269712034e-5`, an oversizing of `2.487509072552481`.\n"
[cases.inputs]
components = ["methane", "ethane", "propane"]
initial_z = [0.85, 0.1, 0.05]
initial_t = 350.0
initial_p = 5000000.0
vessel_volume = 5.0
fire_heat_input = 500000.0
set_pressure = 5000000.0
overpressure_fraction = 0.21
back_pressure = 100000.0
[cases.expected]
steady_required_area = 1.3532429190157695e-4
dynamic_required_area = 5.44015269712034e-5
oversizing_ratio = 2.487509072552481
allowable_pressure = 6028721.75
peak_dynamic_pressure = 6028721.746112543
steady_relief_rate = 1.4285714285714286
