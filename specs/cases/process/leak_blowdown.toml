model = "process.leak_blowdown"
[[cases]]
id = "no_forward_flow_is_a_valid_zero"
tolerance = 1.0e-9
source = "NeqSim `LeakModel.calculateSourceTerm` with the initial pressure at 5 bar and the receiving pressure at 6 bar (`pr_methane_no_forward_flow_3s`): the loop stops before its first substep, so every declared row carries a zero rate, zero velocity and zero momentum.\n"
[cases.inputs]
components = ["methane"]
initial_z = [1.0]
initial_t = 300.0
initial_p = 500000.0
duration = 3.0
vessel_volume = 1.0
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 600000.0
time_step = 1.0
[cases.expected]
status = "valid"
number_of_points = 4
recorded_points = 4
total_mass_released = 0.0
peak_mass_flow_rate = 0.0
time_to_empty = 0.0
[[cases]]
id = "a_hundred_second_sample_is_the_state_at_its_time"
tolerance = 1.0e-5
source = "A single 100 s sample on the 1 m3, 50 bar methane vessel (`pr_single_step_depletion_100s`): the loop takes its 1% substeps to the sample time and records 203.727 K and 1.145 bar, 23.8509 kg released, still above the receiving pressure.\n"
[cases.inputs]
components = ["methane"]
initial_z = [1.0]
initial_t = 300.0
initial_p = 5000000.0
duration = 100.0
vessel_volume = 1.0
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 101325.0
time_step = 100.0
[cases.expected]
status = "valid"
number_of_points = 2
recorded_points = 2
total_mass_released = 23.85093447583642
peak_mass_flow_rate = 0.4305101553432282
time_to_empty = 110.80312127281199
[[cases]]
id = "methane_50bara_ten_seconds"
tolerance = 1.0e-5
source = "The `LeakModelTest` source-term state re-cased on PR (`pr_methane_50bara_10s_1s`): methane at 300 K and 50 bar, a 1 m3 vessel and a 1 cm opening with `Cd = 0.62`, for ten one-second samples.\n"
[cases.inputs]
components = ["methane"]
initial_z = [1.0]
initial_t = 300.0
initial_p = 5000000.0
duration = 10.0
vessel_volume = 1.0
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 101325.0
time_step = 1.0
[cases.expected]
status = "valid"
number_of_points = 11
recorded_points = 11
total_mass_released = 4.034316523740702
peak_mass_flow_rate = 0.4305101553432282
time_to_empty = 18.74202721431417
[[cases]]
id = "a_liquid_initial_state_is_refused"
tolerance = 1.0e-9
source = "A propane vessel at 300 K and 11 bar with a 0.01 m3 volume and a 1 cm opening (`pr_propane_11bara_10s_1s`): the initial flash is a single liquid phase, and the class requires a single gas phase.\n"
[cases.inputs]
components = ["propane"]
initial_z = [1.0]
initial_t = 300.0
initial_p = 1100000.0
duration = 10.0
vessel_volume = 0.01
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 101325.0
time_step = 1.0
[cases.expected]
status = "invalid"
number_of_points = 11
recorded_points = 0
[[cases]]
id = "subsonic_flow_uses_the_density_branch"
tolerance = 1.0e-5
source = "Methane at 2 bar into 1.9 bar (`pr_methane_2bara_subsonic_1s`), where the pressure ratio is above the critical ratio and the class's subsonic `Cd A sqrt(2 rho dP)` branch runs for the whole sample.\n"
[cases.inputs]
components = ["methane"]
initial_z = [1.0]
initial_t = 300.0
initial_p = 200000.0
duration = 1.0
vessel_volume = 1.0
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 190000.0
time_step = 1.0
[cases.expected]
status = "valid"
number_of_points = 2
recorded_points = 2
total_mass_released = 0.007825829692113012
peak_mass_flow_rate = 0.007825829692113012
time_to_empty = 2.0
[[cases]]
id = "a_mixture_is_accepted"
tolerance = 1.0e-5
source = "A methane/ethane mixture at 300 K and 50 bar (`pr_methane_ethane_50bara_5s`); the class's molar mass and capacity ratio are the mixture's, not a pure component's.\n"
[cases.inputs]
components = ["methane", "ethane"]
initial_z = [0.9, 0.1]
initial_t = 300.0
initial_p = 5000000.0
duration = 5.0
vessel_volume = 1.0
hole_diameter = 0.01
discharge_coefficient = 0.62
back_pressure = 101325.0
time_step = 1.0
[cases.expected]
status = "valid"
number_of_points = 6
recorded_points = 6
total_mass_released = 2.1890466050202106
peak_mass_flow_rate = 0.45004143245628836
time_to_empty = 9.728200326234756
