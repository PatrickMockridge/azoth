model = "process.vessel_filling"
[[cases]]
id = "mixture_no_wall"
tolerance = 5.0e-3
source = "`fill_mixture_no_wall_20s`: a methane/ethane/propane residual gas at 288.15 K and 20 bara in a 0.05 m3 vessel charged at 288.15 K, 300 bara and 0.01 kg/s for 20 one-second steps. The gas cools to `277.82064145646126` K as the pressure reaches `2354539.6443632855` Pa. **Tolerance**: the final pressure agrees to `3.9e-3` and the final mass is exact; the VU flash is the divergence.\n"
[cases.inputs]
components = ["methane", "ethane", "propane"]
initial_z = [0.9, 0.07, 0.03]
initial_t = 288.15
initial_p = 2000000.0
vessel_volume = 0.05
inlet_temperature = 288.15
supply_pressure = 30000000.0
inlet_mass_flow = 0.01
time_step = 1.0
max_time = 20.0
[cases.expected]
inlet_temperature = 288.15
inlet_mass_flow = 0.01
vu_flash_fallback_count = 0.0
max_fluid_temperature = 288.15
min_fluid_temperature = 277.82064145646126
max_pressure = 2354539.6443632855
final_pressure = 2354539.6443632855
final_mass = 0.9904500470109547
liner_over_temperature = false
liner_under_temperature = false
liner_limits_met = true
recorded_points = 21.0
[[cases]]
id = "pure_liner_over_5s"
tolerance = 5.0e-3
source = "`fill_pure_liner_over_5s`: the wall state with liner limits of 233.15 K and 287 K, which the gas exceeds, so the over-temperature flag is set and the limits are not met. **Tolerance**: the pressures agree to `4.0e-3`; the VU flash is the divergence.\n"
[cases.inputs]
components = ["methane"]
initial_z = [1.0]
initial_t = 288.15
initial_p = 2000000.0
vessel_volume = 0.05
inlet_temperature = 288.15
supply_pressure = 35000000.0
inlet_mass_flow = 0.02
wall_mass = 50.0
wall_area = 1.0
wall_specific_heat = 470.0
wall_heat_transfer_coefficient = 50.0
liner_min_temperature = 233.15
liner_max_temperature = 287.0
time_step = 0.5
max_time = 5.0
[cases.expected]
inlet_temperature = 288.15
inlet_mass_flow = 0.02
vu_flash_fallback_count = 0.0
max_fluid_temperature = 288.15
min_fluid_temperature = 284.0088072426975
max_pressure = 2224022.2853062903
final_pressure = 2224022.2853062903
final_mass = 0.8003827224111474
liner_over_temperature = true
liner_under_temperature = false
liner_limits_met = false
recorded_points = 11.0

