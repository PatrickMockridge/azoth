model = "process.psv_fire_sizing"

[[cases]]
id = "pf_peak_dominated"
tolerance = 1.0e-12
source = "The peak flow governs: 5 MW into a 1000 kg inventory at 2 kJ/(kg K) gives 50 kg/s against 1.11 kg/s average. From `validation/neqsim/captures/process_psv_fire_sizing.tsv` (`pf_peak_dominated`)."
[cases.inputs]
initial_mass = 1000.0
initial_pressure = 2000000.0
set_pressure = 1000000.0
initial_temperature = 300.0
fire_heat_input = 5000000.0
vessel_volume = 10.0
molar_mass = 0.020
specific_heat_ratio = 1.3
compressibility = 0.9
heat_capacity = 2000.0
blowdown_time = 900.0
[cases.expected]
overpressure_fraction = 0.21
required_area = 0.026034670628401386
required_area_in2 = 40.35382018166251
recommended_orifice = "T"
selected_area_in2 = 26.0
back_pressure_fraction = 0.0837396694214876
discharge_coefficient = 0.975
back_pressure_correction = 1.0
combination_correction = 1.0

[[cases]]
id = "pf_average_dominated"
tolerance = 1.0e-12
source = "The blowdown average governs: 5000 kg in 900 s is 5.56 kg/s against a 1 kg/s peak. From (`pf_average_dominated`)."
[cases.inputs]
initial_mass = 5000.0
initial_pressure = 2000000.0
set_pressure = 1000000.0
initial_temperature = 300.0
fire_heat_input = 100000.0
vessel_volume = 10.0
molar_mass = 0.020
specific_heat_ratio = 1.3
compressibility = 0.9
heat_capacity = 2000.0
blowdown_time = 900.0
[cases.expected]
overpressure_fraction = 0.21
required_area = 0.0023642740172476065
required_area_in2 = 3.6646320559979024
recommended_orifice = "N"
selected_area_in2 = 4.34
back_pressure_fraction = 0.0837396694214876
discharge_coefficient = 0.975
back_pressure_correction = 1.0
combination_correction = 1.0

[[cases]]
id = "pf_helpers"
tolerance = 1.0e-12
source = "The peak state with a 10 % blowdown, a 0.001 m2 orifice and Cv coefficient 0.975, and the H orifice. From (`pf_helpers`)."
[cases.inputs]
initial_mass = 1000.0
initial_pressure = 2000000.0
set_pressure = 1000000.0
initial_temperature = 300.0
fire_heat_input = 5000000.0
vessel_volume = 10.0
molar_mass = 0.020
specific_heat_ratio = 1.3
compressibility = 0.9
heat_capacity = 2000.0
blowdown_time = 900.0
blowdown_percent = 10.0
orifice_area = 0.001
cv_discharge_coefficient = 0.975
[cases.expected]
overpressure_fraction = 0.21
required_area = 0.026034670628401386
required_area_in2 = 40.35382018166251
recommended_orifice = "T"
selected_area_in2 = 26.0
back_pressure_fraction = 0.0837396694214876
discharge_coefficient = 0.975
back_pressure_correction = 1.0
combination_correction = 1.0
blowdown_pressure = 900000.0
flow_coefficient = 37.176824353648705
