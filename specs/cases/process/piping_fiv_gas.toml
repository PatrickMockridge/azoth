model = "process.piping_fiv_gas"
[[cases]]
id = "gas_low"
tolerance = 1.0e-12
source = "A 1 kg/m3 gas at 10 m/s in a 20 D/t line: the momentum flux is 100 Pa and the score is 0.002, low. From `validation/neqsim/captures/process_piping_fiv_gas.tsv` (`fiv_gas_low`)."
[cases.inputs]
density = 1.0
velocity = 10.0
outside_diameter = 0.2
wall_thickness = 0.01
branch_count = 0
pulsation_factor = 1.0
support_quality_factor = 1.0
[cases.expected]
lof = 0.002
likelihood = "low"
rho_v2 = 100.0
d_overt = 20.0
d_overt_factor = 1.0
branch_factor = 1.0
pulsation_factor_applied = 1.0
support_quality_factor_applied = 1.0
energy_term = 0.002
[[cases]]
id = "gas_boundary_030"
tolerance = 1.0e-12
source = "A score of exactly 0.3 is the medium band's lower boundary. From (`fiv_gas_boundary_030`)."
[cases.inputs]
density = 150.0
velocity = 10.0
outside_diameter = 0.2
wall_thickness = 0.01
branch_count = 0
pulsation_factor = 1.0
support_quality_factor = 1.0
[cases.expected]
lof = 0.3
likelihood = "medium"
rho_v2 = 15000.0
d_overt = 20.0
d_overt_factor = 1.0
branch_factor = 1.0
pulsation_factor_applied = 1.0
support_quality_factor_applied = 1.0
energy_term = 0.3
[[cases]]
id = "gas_boundary_050"
tolerance = 1.0e-12
source = "A score of exactly 0.5 is the high band's lower boundary. From (`fiv_gas_boundary_050`)."
