model = "process.psv_sizing"

[[cases]]
id = "ps_gas_choked"
tolerance = 1.0e-12
source = "The critical-flow gas state: 1 kg/s through a 1 MPa set pressure at 10 % overpressure into atmosphere. From `validation/neqsim/captures/process_psv_sizing.tsv` (`ps_gas_choked`)."
[cases.inputs]
service = "gas"
set_pressure = 1000000.0
overpressure_fraction = 0.10
back_pressure = 101325.0
mass_flow = 1.0
temperature = 300.0
molar_mass = 0.020
compressibility = 0.9
specific_heat_ratio = 1.3
[cases.expected]
relieving_pressure = 1100000.0
back_pressure_fraction = 0.09211363636363637
discharge_coefficient = 0.975
required_area = 4.6765883018072297e-4
required_area_in2 = 0.7248726365253937
recommended_orifice = "H"
selected_area_in2 = 0.785
back_pressure_correction = 1.0
combination_correction = 1.0

