model = "process.multi_vessel_blowdown_study"
[[cases]]
id = "two_sources_no_header"
tolerance = 1.0e-12
source = "`mv_two_sources_no_header`: a 40 kg/s source decaying to zero over 5 s and a 25 kg/s source over 3 s, on a 1 s grid with no header. The peak is `65` kg/s at 0 s, from `40` and `25`.\n"
[cases.inputs]
samples = [
  { source = "HP-sep", time = 0.0, mass_flow = 40.0 },
  { source = "HP-sep", time = 1.0, mass_flow = 32.0 },
  { source = "HP-sep", time = 2.0, mass_flow = 24.0 },
  { source = "HP-sep", time = 3.0, mass_flow = 16.0 },
  { source = "HP-sep", time = 4.0, mass_flow = 7.999999999999998 },
  { source = "HP-sep", time = 5.0, mass_flow = 0.0 },
  { source = "Inlet-sep", time = 0.0, mass_flow = 25.0 },
  { source = "Inlet-sep", time = 1.0, mass_flow = 16.666666666666668 },
  { source = "Inlet-sep", time = 2.0, mass_flow = 8.333333333333334 },
  { source = "Inlet-sep", time = 3.0, mass_flow = 0.0 },
]
[cases.expected]
peak_total_mass_flow = 65.0
peak_time = 0.0
max_allowable_mach = 0.7
header_mach_acceptable = true
[[cases]]
id = "small_header_exceeded"
tolerance = 1.0e-12
source = "`mv_small_header_exceeded`: the same sources through a 0.2 m header at 1.5 bara and 288.15 K, where the peak gives `1652.231406916753` m/s and Mach `4.186970229513444`, above the 0.7 limit.\n"
[cases.inputs]
samples = [
  { source = "HP-sep", time = 0.0, mass_flow = 40.0 },
  { source = "HP-sep", time = 1.0, mass_flow = 32.0 },
  { source = "HP-sep", time = 2.0, mass_flow = 24.0 },
  { source = "HP-sep", time = 3.0, mass_flow = 16.0 },
  { source = "HP-sep", time = 4.0, mass_flow = 7.999999999999998 },
  { source = "HP-sep", time = 5.0, mass_flow = 0.0 },
  { source = "Inlet-sep", time = 0.0, mass_flow = 25.0 },
  { source = "Inlet-sep", time = 1.0, mass_flow = 16.666666666666668 },
  { source = "Inlet-sep", time = 2.0, mass_flow = 8.333333333333334 },
  { source = "Inlet-sep", time = 3.0, mass_flow = 0.0 },
]
header_diameter = 0.2
header_pressure = 150000.0
header_temperature = 288.15
header_molar_mass = 0.020
header_heat_capacity_ratio = 1.3
[cases.expected]
peak_total_mass_flow = 65.0
peak_time = 0.0
header_velocity = 1652.231406916753
header_mach = 4.186970229513444
max_allowable_mach = 0.7
header_mach_acceptable = false
[[cases]]
id = "large_header_acceptable"
tolerance = 1.0e-12
source = "`mv_large_header_acceptable`: the same sources through a 0.8 m header, where the peak gives `103.26446293229706` m/s and Mach `0.26168563934459027`, within the limit.\n"
[cases.inputs]
samples = [
  { source = "HP-sep", time = 0.0, mass_flow = 40.0 },
  { source = "HP-sep", time = 1.0, mass_flow = 32.0 },
  { source = "HP-sep", time = 2.0, mass_flow = 24.0 },
  { source = "HP-sep", time = 3.0, mass_flow = 16.0 },
  { source = "HP-sep", time = 4.0, mass_flow = 7.999999999999998 },
  { source = "HP-sep", time = 5.0, mass_flow = 0.0 },
  { source = "Inlet-sep", time = 0.0, mass_flow = 25.0 },
  { source = "Inlet-sep", time = 1.0, mass_flow = 16.666666666666668 },
  { source = "Inlet-sep", time = 2.0, mass_flow = 8.333333333333334 },
  { source = "Inlet-sep", time = 3.0, mass_flow = 0.0 },
]
header_diameter = 0.8
header_pressure = 150000.0
header_temperature = 288.15
header_molar_mass = 0.020
header_heat_capacity_ratio = 1.3
[cases.expected]
peak_total_mass_flow = 65.0
peak_time = 0.0
header_velocity = 103.26446293229706
header_mach = 0.26168563934459027
max_allowable_mach = 0.7
header_mach_acceptable = true
