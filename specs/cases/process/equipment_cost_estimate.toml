model = "process.equipment_cost_estimate"
[[cases]]
id = "column_trayed"
tolerance = 1.0e-12
source = "`ColumnCostEstimate` with no mechanical design: a 2 m, 25 m sieve-tray column of 30 trays at 15 barg, a 2000 kW reboiler and a 1500 kW condenser, from `validation/neqsim/captures/process_cost_equipment.tsv` (`equipment_column_trayed`). The class computes the purchased cost and no stack without a design."
[cases.inputs]
equipment = [
  { equipment = "column", name = "Depropaniser", column_type = "trayed", tray_type = "sieve", diameter = 2.0, height = 25.0, number_of_trays = 30.0, design_pressure_barg = 15.0, include_reboiler = true, include_condenser = true, reboiler_duty = 2000.0, condenser_duty = 1500.0, material = "carbon_steel" },
]
[cases.expected]
