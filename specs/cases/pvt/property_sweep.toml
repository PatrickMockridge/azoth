model = "pvt.property_sweep"
[[cases]]
id = "density_binary"
tolerance = 1.0e-6
source = "The class's sweep at the stated states, from `validation/neqsim/captures/pvt_property_sweep.tsv`."
[cases.inputs]
mode = "density"
components = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 0.7 },
    { fluid = 0, name = "nC10", pseudo_component = false, moles = 0.3 },
]
temperatures = [323.15, 313.15, 303.15]
pressures = [500000.0, 500000.0, 500000.0]
[cases.expected]
points = [
    { temperature = 323.15, pressure = 500000.0, gas_density = 3.050545344825013, oil_density = 726.5941347934073, gas_phase_available = true, oil_phase_available = true, aqueous_phase_available = false },
    { temperature = 313.15, pressure = 500000.0, gas_density = 3.1296049183564243, oil_density = 733.7252998896703, gas_phase_available = true, oil_phase_available = true, aqueous_phase_available = false },
    { temperature = 303.15, pressure = 500000.0, gas_density = 3.2231580078607283, oil_density = 740.5801176791438, gas_phase_available = true, oil_phase_available = true, aqueous_phase_available = false },
]
