model = "pvt.swelling_test"
[[cases]]
id = "swelling_upstream"
tolerance = 1.0e-6
source = "The class's swelling experiment, from `validation/neqsim/captures/pvt_swelling.tsv`; the upstream case is the pinned numeric assertion."
[cases.inputs]
components = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 0.2 },
    { fluid = 0, name = "nC10", pseudo_component = false, moles = 0.8 },
]
injection_gas = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 1.0 },
]
mixing_rule = "zero"
volume_correction = false
temperature = 353.15
cumulative_gas_injected = [0.0, 0.1, 0.2]
[cases.expected]
original_oil_moles = 1.0
points = [
    { cumulative_gas_injected = 0.0, pressure = 5128370.972140508, relative_oil_volume = 1.0 },
    { cumulative_gas_injected = 0.1, pressure = 7320109.92148898, relative_oil_volume = 1.0301020971426877 },
    { cumulative_gas_injected = 0.2, pressure = 9314150.739597373, relative_oil_volume = 1.0602317415732485 },
]
