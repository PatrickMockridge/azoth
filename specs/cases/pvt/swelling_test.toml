volume_correction = false
temperature = 323.15
cumulative_gas_injected = [0.0, 0.05, 0.15, 0.25]
[cases.expected]
original_oil_moles = 1.0
points = [
    { cumulative_gas_injected = 0.0, pressure = 1.4411248035344983E7, relative_oil_volume = 1.0 },
