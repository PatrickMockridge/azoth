    { cumulative_gas_injected = 0.15, pressure = 1.5993753734622786E7, relative_oil_volume = 1.066626241688908 },
    { cumulative_gas_injected = 0.25, pressure = 1.6885067716831215E7, relative_oil_volume = 1.1115123217160363 },
