tolerance = 1.0e-6
source = "The class's cascade on the methane/n-decane binary, from `validation/neqsim/captures/pvt_separator.tsv`."
[cases.inputs]
mode = "continuous"
stages = [
    { pressure = 5000000.0, temperature = 323.15 },
    { pressure = 2000000.0, temperature = 313.15 },
    { pressure = 500000.0, temperature = 303.15 },
    { pressure = 101325.0, temperature = 288.15 },
]
