eo_history = [0.1, 0.2, 0.3]
[cases.expected]
ooip = 9999999.999999998
m_fit = 0.0
r_squared = 1.0
[[cases]]
id = "fit_gas_cap_drive"
tolerance = 1.0e-9
source = "The two-predictor gas-cap fit on non-collinear predictors."
[cases.inputs]
calculation = "fit_gas_cap_drive"
f_history = [1030000.0, 2036000.0, 3060000.0]
eo_history = [0.1, 0.2, 0.3]
eg_history = [0.015, 0.018, 0.03]
[cases.expected]
ooip = 9999999.999999957
m_fit = 0.20000000000005388
r_squared = 1.0
[[cases]]
id = "fit_water_drive"
tolerance = 1.0e-9
source = "The water-drive plot with a known influx."
