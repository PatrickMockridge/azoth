model = "pvt.oil_material_balance"
[[cases]]
id = "withdrawal_f"
tolerance = 1.0e-9
source = "The class's withdrawal term, from `validation/neqsim/captures/pvt_oil_material_balance.tsv`."
[cases.inputs]
calculation = "withdrawal_f"
np = 1000000.0
rp = 500.0
bo = 1.2
rs = 300.0
bg = 0.005
wp = 100000.0
bw = 1.01
[cases.expected]
f = 2301000.0
[[cases]]
id = "eo"
tolerance = 1.0e-9
source = "The oil and dissolved-gas expansion term."
[cases.inputs]
calculation = "eo"
bo = 1.2
boi = 1.3
rsi = 400.0
rs = 300.0
bg = 0.005
[cases.expected]
eo_value = 0.3999999999999999
[[cases]]
id = "eg"
tolerance = 1.0e-9
source = "The gas-cap expansion term."
[cases.inputs]
calculation = "eg"
boi = 1.3
bg = 0.005
bgi = 0.004
[cases.expected]
eg_value = 0.325
[[cases]]
id = "efw"
tolerance = 1.0e-9
source = "The connate-water and rock expansion term."
[cases.inputs]
calculation = "efw"
boi = 1.3
m = 0.2
cw = 4.0e-5
swi = 0.2
cf = 3.0e-5
delta_p = 50.0
[cases.expected]
efw_value = 0.003705000000000001
[[cases]]
id = "fit_depletion_drive"
tolerance = 1.0e-9
source = "The depletion-drive fit through the origin."
[cases.inputs]
calculation = "fit_depletion_drive"
