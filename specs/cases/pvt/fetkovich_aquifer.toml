model = "pvt.fetkovich_aquifer"
[[cases]]
id = "constant_pressure"
tolerance = 1.0e-12
source = "The class's constant-pressure identity: 1e6 m3, 1e-4 1/bar, 0.02 m3/(s bar) and 12000 s at 250 bara, from `validation/neqsim/captures/pvt_fetkovich_aquifer.tsv`."
[cases.inputs]
initial_water_volume = 1000000.0
total_compressibility = 1.0e-9
productivity = 2.0e-7
initial_pressure = 30000000.0
intervals = [{ duration = 12000.0, reservoir_pressure_start = 25000000.0, reservoir_pressure_end = 25000000.0 }]
[cases.expected]
capacity = 0.001
states = [
  { time = 0.0, cumulative_influx = 0.0, pressure = 30000000.0, interval_influx = 0.0, interval_minimum_cumulative_influx = 0.0, interval_maximum_cumulative_influx = 0.0 },
  { time = 12000.0, cumulative_influx = 4546.410233552938, pressure = 25453589.766447064, interval_influx = 4546.410233552938, interval_minimum_cumulative_influx = 0.0, interval_maximum_cumulative_influx = 4546.410233552938 },
]
