model = "pvt.saturation_test"
[[cases]]
id = "pressure_methane_nc10_323"
tolerance = 1.0e-6
source = "Methane/n-decane 0.70/0.30 at 323.15 K, SRK classic mixing, from `validation/neqsim/captures/pvt_saturation.tsv`."
[cases.inputs]
components = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 0.70 },
    { fluid = 0, name = "nC10", pseudo_component = false, moles = 0.30 },
]
mode = "pressure"
temperature = 323.15
[cases.expected]
saturation_pressure = 28955195.999145508
[[cases]]
id = "pressure_methane_nbutane_275"
tolerance = 1.0e-6
source = "Methane/n-butane 0.95/0.05 at 275 K, SRK classic mixing."
[cases.inputs]
components = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 0.95 },
    { fluid = 0, name = "n-butane", pseudo_component = false, moles = 0.05 },
]
mode = "pressure"
temperature = 275.0
[cases.expected]
saturation_pressure = 7495956.039428711
[[cases]]
id = "pressure_fallback_methane_300"
tolerance = 1.0e-12
source = "Pure methane at 300 K, above its critical temperature: no pressure brackets a two-phase region, and the class answers the top of its grid."
[cases.inputs]
components = [{ fluid = 0, name = "methane", pseudo_component = false, moles = 1.0 }]
mode = "pressure"
temperature = 300.0
[cases.expected]
saturation_pressure = 100000000.0
[[cases]]
id = "temperature_methane_nc10_52bara"
tolerance = 1.0e-6
source = "The same methane/n-decane fluid at 52.1 bar, searched for its upper saturation temperature."
[cases.inputs]
components = [
    { fluid = 0, name = "methane", pseudo_component = false, moles = 0.70 },
    { fluid = 0, name = "nC10", pseudo_component = false, moles = 0.30 },
]
mode = "temperature"
pressure = 5210000.0
[cases.expected]
saturation_temperature = 557.1245384216309
[[cases]]
id = "temperature_fallback_methane_100bara"
tolerance = 1.0e-12
source = "Pure methane at 100 bar, above its critical pressure: no temperature brackets a two-phase region, and the class answers the top of its grid."
[cases.inputs]
components = [{ fluid = 0, name = "methane", pseudo_component = false, moles = 1.0 }]
mode = "temperature"
pressure = 10000000.0
[cases.expected]
saturation_temperature = 1200.0
