model = "pvt.gas_material_balance"
[[cases]]
id = "bg"
tolerance = 1.0e-9
source = "The class's gas FVF at 300 bara, Z 0.9 and 350 K, from `validation/neqsim/captures/pvt_gas_material_balance.tsv`."
[cases.inputs]
calculation = "bg"
pressure_value = 30000000.0
z_value = 0.9
temperature = 350.0
[cases.expected]
gas_fvf = 0.0036850559384849855
[[cases]]
id = "fit_volumetric"
tolerance = 1.0e-9
source = "The p/Z fit over five history points with supplied Z."
[cases.inputs]
calculation = "fit_volumetric"
pressure = [30000000.0, 25000000.0, 20000000.0, 15000000.0, 10000000.0]
z = [0.9, 0.88, 0.85, 0.82, 0.8]
gp = [0.0, 1000000.0, 2000000.0, 3000000.0, 4000000.0]
[cases.expected]
ogip = 6482720.260271815
pi_over_zi = 335.6951871657755
slope = -5.178307464892834e-05
r_squared = 0.998697084170453
