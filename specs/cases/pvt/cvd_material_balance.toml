[[cases]]
id = "gas_only"
tolerance = 1e-12
source = "A single component at zero liquid volume: both rows are an absent liquid, and the accounting closes. From `CvdMaterialBalanceTest.absentAndVanishingLiquidHaveExplicitLimits`."
[cases.inputs]
component_names = ["A"]
observations = [
  { pressure = 100.0, gas_z = 1.0, liquid_volume_fraction = 0.0, cumulative_produced = 0.0 },
  { pressure = 50.0, gas_z = 1.0, liquid_volume_fraction = 0.0, cumulative_produced = 0.5 },
]
vapor_compositions = [
  [1.0],
  [1.0],
]
balance_tolerance = 1e-12
minimum_liquid_moles = 1e-08
[cases.expected]
stages = [
  { total_moles = 1.0, vapor_moles = 1.0, liquid_moles = 0.0, stage_withdrawn_moles = 0.0, component_closure = 0.0, remaining_closure = 0.0, produced_closure = 0.0, vapor_closure = 0.0, liquid_state = "absent", compatible = true },
  { total_moles = 0.5, vapor_moles = 0.5, liquid_moles = 0.0, stage_withdrawn_moles = 0.5, component_closure = 0.0, remaining_closure = 0.0, produced_closure = 0.0, vapor_closure = 0.0, liquid_state = "absent", compatible = true },
]
