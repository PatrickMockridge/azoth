model = "pvt.cvd_material_balance"
[[cases]]
id = "analytic_binary"
tolerance = 1e-12
source = "The class test's analytic binary path: the saturation reference, then two withdrawals of 0.2 with 20 percent liquid volume. From `CvdMaterialBalanceTest.analyticBinaryConservesEveryComponentAcrossTheWholePath`."
[cases.inputs]
component_names = ["A", "B"]
observations = [
  { pressure = 10000000.0, gas_z = 1.0, liquid_volume_fraction = 0.0, cumulative_produced = 0.0 },
  { pressure = 5000000.0, gas_z = 1.0, liquid_volume_fraction = 0.2, cumulative_produced = 0.2 },
  { pressure = 2500000.0, gas_z = 1.0, liquid_volume_fraction = 0.2, cumulative_produced = 0.4 },
]
vapor_compositions = [
  [0.8, 0.2],
  [0.9, 0.1],
  [0.9, 0.1],
]
balance_tolerance = 1e-12
minimum_liquid_moles = 1e-08
[cases.expected]
stages = [
  { total_moles = 1.0, vapor_moles = 1.0, liquid_moles = 0.0, stage_withdrawn_moles = 0.0, component_closure = 0.0, remaining_closure = 0.0, produced_closure = 0.0, vapor_closure = 0.0, liquid_state = "absent", compatible = true },
  { total_moles = 0.8, vapor_moles = 0.4, liquid_moles = 0.4, stage_withdrawn_moles = 0.2, component_closure = -1.1102230246251565e-16, remaining_closure = 0.0, produced_closure = 0.0, vapor_closure = 0.0, liquid_state = "resolved", compatible = true },
  { total_moles = 0.6, vapor_moles = 0.2, liquid_moles = 0.39999999999999997, stage_withdrawn_moles = 0.2, component_closure = 5.551115123125783e-17, remaining_closure = 0.0, produced_closure = 0.0, vapor_closure = 0.0, liquid_state = "resolved", compatible = true },
]
