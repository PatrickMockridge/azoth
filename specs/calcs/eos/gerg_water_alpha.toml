value = -0.213781
source = "NeqSim AttractiveTermGERG.parametersGERG[1]"
[[provenance.constants]]
name = "GERG_LIQUID_C3"
value = 0.26005
source = "NeqSim AttractiveTermGERG.parametersGERG[2]"
[[provenance.constants]]
name = "GERG_SOLID_C1"
value = 0.106025
source = "NeqSim AttractiveTermGERG.parametersSolidGERG[0]"
[[provenance.constants]]
name = "GERG_SOLID_C2"
value = 2.683845
source = "NeqSim AttractiveTermGERG.parametersSolidGERG[1]"
[[provenance.constants]]
