id = "eos.gerg_water_alpha"
name = "GERG water alpha function"
summary = "The GERG water attraction-temperature function, with its solid and liquid coefficient sets. Use it when a cubic EOS carries the GERG water alpha."
equation = "u = 1 - sqrt(temperature/critical_temperature); alpha = (1 + c1*u + c2*u**2 + c3*u**4)**2, with c the liquid set at 273.16 K and above and the solid set below it"
latex = '''u = 1 - \sqrt{T/T_c}, \qquad \alpha = \left(1 + c_1 u + c_2 u^2 + c_3 u^4\right)^2, \qquad c = \begin{cases} c^{\mathrm{solid}} & T < 273.16\ \mathrm{K} \\ c^{\mathrm{liquid}} & T \ge 273.16\ \mathrm{K} \end{cases}'''
assumptions = ["**the water branch only.** For any other component `AttractiveTermGERG.alpha` delegates to `AttractiveTermPr.alpha`, which is `eos.pr_alpha_ab`; this id is the water override.\n", "**the component's critical temperature is the caller's.** The class reads `getComponent().getTC()`; the probe's water carries the databank's 647.3 K.\n"]
notes = ["**the constructor's parameter copy is dead.** `alpha()` calls `selectWaterParameters`, which overwrites `parameters` before reading it, so the component's `(1.087, -0.638, 0.635)` is never used.\n", "**the switch is at 273.16 K.** `alpha(273.15)` is 1.6769439037650673 (solid) and `alpha(273.16)` is 1.6768315406668797 (liquid); `selectWaterParameters` tests `temperature < 273.16`.\n", "**the id is the alpha only.** `members` names `alpha`; the class's derivative methods are outside it.\n"]
references = ["NeqSim master `thermo/component/attractiveeosterm/AttractiveTermGERG.java`, Apache-2.0, commit b40bb1134508faa24b07aed9a23c4d52865e5c2a.", "Mathias, P. M.; Copeman, T. W. (1983). \"Extension of the Peng-Robinson equation of state to complex mixtures: evaluation of the various forms of the local composition concept.\" Fluid Phase Equilib. 13, 91-108. DOI 10.1016/0378-3812(83)80084-3. The three-parameter alpha form.", "`validation/neqsim/captures/gerg_water_alpha_probe.tsv` - the component's parameters and alpha at six temperatures either side of the switch.\n"]
[source]
standard = "NeqSim master `AttractiveTermGERG`"
edition = "`alpha(temperature)`, the water branch, with the 273.16 K solid/liquid coefficient switch in `selectWaterParameters`"

[source.neqsim]
class = "AttractiveTermGERG"
members = ["AttractiveTermGERG.alpha"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[inputs]
[inputs.temperature]
unit = "K"
description = "the absolute temperature at which the alpha is evaluated.\n"
[inputs.critical_temperature]
unit = "K"
description = "the component's critical temperature, from `getComponent().getTC()`.\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function.\n"
[[valid_range]]
quantity = "temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "critical_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "the reduced temperature divides by it.\n"
[worked_example]
source = "the capture's `alpha_T_300` row at NeqSim b40bb113."
derivation = "T = 300 K, Tc = 647.3 K, the liquid set:\n\n  Tr = 300/647.3 = 0.4634636181059787\n  sqrt(Tr) = 0.6807816229202862\n  u = 1 - sqrt(Tr) = 0.3192183770797138\n  u**2 = 0.10190037226540634\n  u**4 = 0.010383685867828394\n  inner = 1 + 0.905436*u - 0.213781*u**2 + 0.26005*u**4 = 1.2699477244962056\n  alpha = inner**2 = 1.6127672229530905\n"
tolerance = 1e-12
[worked_example.inputs]
temperature = 300.0
critical_temperature = 647.3
[worked_example.expected]
alpha = 1.6127672229530905
[provenance.inputs]
default = "caller"

[provenance.outputs]
default = "NeqSim AttractiveTermGERG.alpha"

