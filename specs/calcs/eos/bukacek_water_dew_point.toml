[[provenance.constants]]
name = "STEP"
value = 100000.0
source = "NeqSim BukacekWaterInGas.waterDewPointTemperature, `(newppm - moleFractionWaterInGas) * 1e5`"
[[provenance.constants]]
name = "RELATIVE_TOLERANCE"
value = 1e-08
source = "NeqSim BukacekWaterInGas.waterDewPointTemperature, the `1e-8` test"
[[provenance.constants]]
name = "MAX_ITERATIONS"
value = 1000
source = "NeqSim BukacekWaterInGas.waterDewPointTemperature, `iter < 1000`"

