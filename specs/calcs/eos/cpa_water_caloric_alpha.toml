id = "eos.cpa_water_caloric_alpha"
name = "Caloric-fitted SRK-CPA water alpha function"
summary = "The caloric-data-fitted five-parameter alpha function for SRK-CPA water. Use it when an SRK-CPA water phase carries the calibration."
equation = "u = 1 - sqrt(temperature/critical_temperature); alpha = (1 + c1*u + c2*u**2 + c3*u**3 + c4*u**4 + c5*u**5)**2"
latex = '''u = 1 - \sqrt{T/T_c}, \qquad \alpha = \left(1 + c_1 u + c_2 u^2 + c_3 u^3 + c_4 u^4 + c_5 u^5\right)^2'''
assumptions = ["**water only.** The constructor refuses any other component (`IllegalArgumentException`); the id carries the water calculation and no component selector.\n", "**the five coefficients are the class's own calibration, not the cited paper's parameter set.** NeqSim's class docstring says so: the form follows Palma, Queimada and Coutinho (2017), the coefficients are a new fit.\n", "**only the temperature dependence changes.** The water `a0`, `b`, association energy and association volume are the standard SRK-CPA ones; this alpha scales the attraction.\n"]
notes = ["**the parent's fallback is unreachable here.** `AttractiveTermMatCop5PRUMR.alpha` falls back to the standard Peng-Robinson form only when every coefficient is below `1e-20`; all five are non-zero.\n", "**`setm` stores the legacy CPA coefficient without changing the fit.** The class overrides `setm` to assign `m` and no other field; the calibrated coefficients above are unaffected.\n"]
references = ["Palma, A. M.; Queimada, A. J.; Coutinho, J. A. P. (2017). \"Modelling the thermodynamic properties of aqueous solutions with a cubic-plus-association equation of state.\" Ind. Eng. Chem. Res. DOI 10.1021/acs.iecr.7b03522. The flexible-alpha form the class follows.", "NeqSim master `thermo/component/attractiveeosterm/AttractiveTermCPAWaterCaloric.java`, Apache-2.0, commit b40bb1134508faa24b07aed9a23c4d52865e5c2a.", "`validation/neqsim/captures/cpa_water_caloric_probe.tsv` - alpha at 278.15, 298.15, 333.15, 373.15 and 423.15 K.\n"]
[source]
standard = "NeqSim master `AttractiveTermCPAWaterCaloric`"
edition = "`alpha(temperature)` with the class's five calibrated coefficients; the parent's algebra, the class's fit"

[source.neqsim]
class = "AttractiveTermCPAWaterCaloric"
members = ["AttractiveTermCPAWaterCaloric.alpha"]
commit = "b40bb1134508faa24b07aed9a23c4d52865e5c2a"

[inputs]
[inputs.temperature]
unit = "K"
description = "the absolute temperature at which the alpha is evaluated.\n"
[inputs.critical_temperature]
unit = "K"
description = "the water component's critical temperature, from `getComponent().getTC()`.\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function.\n"
[[valid_range]]
quantity = "temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "critical_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "the reduced temperature divides by it.\n"
[worked_example]
source = "the capture's `alpha_T_298.15` row at NeqSim b40bb113."
derivation = "T = 298.15 K, Tc = 647.3 K:\n\n  Tr = 298.15/647.3 = 0.4606055924609918\n  sqrt(Tr) = 0.6786793001565554\n  u = 1 - sqrt(Tr) = 0.3213206998434446\n  inner = 1 + 0.6670190973128074*u - 0.25656681951681287*u**2 + 1.3687767086793399*u**3 - 3.1891110889699097*u**4 + 5.218580308820144*u**5 = 1.2171262559922698\n  alpha = inner**2 = 1.4813963230257607\n"
tolerance = 1e-12
[worked_example.inputs]
temperature = 298.15
critical_temperature = 647.3
[worked_example.expected]
alpha = 1.4813963230257607
[provenance.inputs]
default = "caller"

